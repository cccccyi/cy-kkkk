name: Apply validated security fix

on:
  push:
    branches:
      - codex/security-dependency-fixes-2026-09-07

permissions:
  contents: write

concurrency:
  group: codex-security-dependency-fixes-2026-09-07
  cancel-in-progress: false

jobs:
  apply-fix:
    if: github.actor == 'cccccyi'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the staged payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD origin/main)" = "267490793c6d0692170622d732135d73f22d1033"
          cat \
            .codex-security-fix.part01 \
            .codex-security-fix.part02 \
            .codex-security-fix.part03 \
            .codex-security-fix.part04 \
            | base64 --decode > .codex-security-fix.tar.gz
          echo "97b19e18c6828cd5a69ae2a292916c16a733309349c8e2fbecb2e74bdf800631  .codex-security-fix.tar.gz" | sha256sum -c -
          test "$(tar -tzf .codex-security-fix.tar.gz | wc -l | tr -d ' ')" = "228"
          if tar -tzf .codex-security-fix.tar.gz | grep -q '^AI快讯转写豆包版/'; then
            echo "Refusing to include the protected local working directory" >&2
            exit 1
          fi

      - name: Apply the reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .codex-security-fix.tar.gz
          git rm -r -q --ignore-unmatch -- \
            'Backend-List/selfdriven/resources/app/node_modules' \
            'Backend-List/yy_blockchain_crawler/node_modules' \
            'Backend-List/yy_schedule/node_modules' \
            'antSwap/子图部分/graph-studio-test/uniswap-v-3-hashkey-testnet/node_modules' \
            '哈世链闻网站及app代码/关键帧生成器/node_modules' \
            '快讯转语音讯飞版/node_modules' \
            '新爬虫，自动转载推文到app/node_modules' \
            '新私信后端程序/node_modules' \
            '海报生成器前端/node_modules' \
            '自动回复服务端/xauto_server2/node_modules' \
            '资讯管理后台后端/node_modules' \
            '采集数据处理相关/selfdriven/resources/app/node_modules' \
            '新爬虫，自动转载推文到app/user_data' \
            'antSwap/前端/build' \
            'catswap/web/build' \
            'Backend-List/arb_python/.env' \
            'Backend-List/arb_python/arbitrage_log_20250918.log' \
            'Backend-List/arb_python/arbitrage_log_20250919.log' \
            'Backend-List/arb_python/private_key_c85.txt' \
            'Backend-List/media-backend/RESTClient/pool.http' \
            'Backend-List/media-backend/backend-web/src/utils/jsencrypt.js' \
            'TG推送豆包版/binance.log' \
            'TG推送豆包版/binance_channel_session_001.session' \
            'TG推送豆包版/binance_channel_session_001.session-journal' \
            'TG推送豆包版/nohup.out' \
            'TG推送豆包版/push2.log' \
            'TG推送豆包版/tg_client.log' \
            'TG推送豆包版/tg_session_001.session' \
            'TG推送豆包版/tg_session_001.session-journal' \
            'TG推送豆包版/tg_session_coinchong.session' \
            'TG推送豆包版/tg_session_coinchong.session-journal' \
            'app推送服务/jpush/push_bot/bot.log' \
            'app推送服务/jpush/push_bot/push2.log' \
            'app推送服务/jpush/push_bot/push3.log' \
            'launchpad/web/pool(2).http' \
            'launchpad/web/pool-20250212.http' \
            'media-backend/RESTClient/pool.http' \
            'media-backend/backend-web/src/utils/jsencrypt.js' \
            'tg活跃机器人/account1.session' \
            'tg活跃机器人/account2.session' \
            'tg活跃机器人/account3.session' \
            'tg活跃机器人/account4.session' \
            'tg活跃机器人/chat1125.json' \
            'tg活跃机器人/chat1126.json' \
            'tg活跃机器人/chat1202.json' \
            '各类网站爬虫/binance_ann_debug.log' \
            '哈世链闻网站及app代码/IOS证书文件/hashnews.mobileprovision' \
            '哈世链闻网站及app代码/IOS证书文件/hashnews_adhoc.mobileprovision' \
            '哈世链闻网站及app代码/IOS证书文件/push证书.p12' \
            '哈世链闻网站及app代码/IOS证书文件/证书.p12' \
            '哈世链闻网站及app代码/web/pool(2).http' \
            '新爬虫，自动转载推文到app/.env' \
            '自动回复服务端/xauto_server2/server.log' \
            '资讯管理后台后端/.env' \
            '资讯管理后台后端/.env.production'
          git rm -q --ignore-unmatch -- \
            '.codex-security-fix.part01' \
            '.codex-security-fix.part02' \
            '.codex-security-fix.part03' \
            '.codex-security-fix.part04' \
            '.github/workflows/codex-apply-security-fix.yml'
          rm .codex-security-fix.tar.gz
          git add -A
          test -z "$(git diff --cached --name-only -- 'AI快讯转写豆包版')"
          test "$(git write-tree)" = "41e0bc0e5a5b7abd1557b30bce4ddd96a3c2172a"
          git config user.name 'cccccyi'
          git config user.email 'cccccyi@users.noreply.github.com'
          git commit -q -m 'fix: patch vulnerable dependencies and harden security boundaries'
          git push origin "HEAD:${GITHUB_REF_NAME}"
