    <style>

        .flIcon {

            cursor: pointer;

        .tts {

        }

        .getMore {

            background: rgba(234, 238, 243, 0.5);

            align-items: center;

            position: relative;

        }

        .xIcon {
            width: 20px;
            height: 20px;
            background-size: cover;

            display: inline-block;
            position: relative;
            margin-right: 6px;
            top: 5px;

        .ndTime {

        }

        .ndMsg {
            display: block;
            width: 100%;
            font-size: 16px;
            line-height: 37px;
            margin-bottom: 25px;
            white-space: pre-wrap;
            color: #222;
            margin-top: 2px;
        }

        .hotNum {
            border: solid 1px #efeeee;
            border-radius: 10px;
            margin-top: 10px;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .hotNum .hotNumItem {
            text-align: center;
            border-right: solid 1px #efeeee;
        }

        .hotNum .hotNumItem .itemNum {
            font-size: 25px;
            line-height: 30px;
            position: relative;
            top: 2px;
        }

        .hotNum .hotNumItem .itemTitle {
            font-size: 13px;
            color: #7b8485;
            line-height: 30px;
            position: relative;
            top: 2px;
        }

        .whale {
            border: solid 1px blue;
            height: 200px;
        }

        .newsItem {
            border-bottom: 1px solid #efeeee;
            position: relative;
            padding-top: 20px;
        }

        .newsItem .toX {
            float: right;
            color: #002fa7;
            cursor: pointer;
        }

        .newsItem .newsTitle {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            line-height: 26px;
            display: inline;
            cursor: pointer;
        }

        .newsItem .newsMsg {
            font-size: 13px;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            display: -webkit-box;
            overflow: hidden;
            text-overflow: ellipsis;
            color: rgb(100, 100, 100);
            line-height: 25px;
        }

        .newsItem .timeW {
            font-size: 13px;
            color: #868686;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
        }

        .title .moreFlash {
            font-size: 18px;
            color: #002fa7;
            float: right;
            cursor: pointer;
            margin-right: 10px;
        }

        .title .moreFlash .micon {
            font-size: 14px;
        }

        .hot {
            margin-top: -10px;
        }

        /* 适配手机样式 */
        @media (max-width: 1100px) {

            /* .custom-audio{
    display: none;
  } */
            .custom-audio {
                margin-left: 10px !important;
            }

            .flIcon {
                margin-right: 25px !important;
            }

            .mt {
                margin-top: 20px;
            }


            .ndTitle {
                font-size: 21px;
                line-height: 31px;
                color: rgb(61, 61, 61);
                margin-bottom: 24px;
                word-break: break-word;
                font-weight: 500;
            }

            .inpam {
                margin-top: -15px;
            }

            .inpam .pticon {
                width: 128px;
                margin-top: 6px;
            }

            .ndMsg {
                line-height: 30px;
                color: #4d4d4d;
            }

            .title {
                display: none;
            }

            #coinNum {
                display: none;
            }

            #hot {
                display: none;
            }

            #hotX {
                display: none;
            }

            .flashTags {
                display: none;
            }
        }

        /* 适配电脑样式 */
        @media (min-width: 1100px) {
            .custom-audio-m {
                display: none !important;
            }
        }

        [v-cloak] {
            display: none;
        }

        .mpd {
            padding-left: 15px;
            padding-right: 15px;
            margin-top: 10px;
        }

        .ttImg {
            width: 100%;
            margin-top: 10px;
        }
    </style>

              alt=""> -->

                </span>

            <!-- <img @click.stop="playAudio(newsDt['sounds'])" v-if="newsDt['sounds']" src="@/assets/tts.png" class="tts tl"
            alt="">
          <img @click.stop="playAudio(newsDt['sounds'])" v-if="newsDt['sounds']" src="@/assets/tts_dark.png"
            style="display: none;" class="tts tdrk" alt=""> -->

            <div>

                <!-- <font-awesome-icon :icon="['fas', 'volume-high']" class="flIcon" style="margin-right: 10px !important;" /> -->
                <!-- <AudioPlayer v-if="newsDt.sounds" width="200px" class="custom-audio" :src="'https://hashnews.pro/sounds/'+newsDt.sounds" @click.stop=""/>
              <font-awesome-icon :icon="['fas', 'image']" class="flIcon" @click = "showPoster(newsDt)"  style="margin-right: 10px !important;" />
              <font-awesome-icon :icon="['fas', 'copy']" class="flIcon"
                @click="copy(newsDt['title'],newsDt['detailContent'])" /> -->

                <!-- <i class="fa-solid fa-image flIcon" style="margin-right: 5px !important;"></i>-->
                <i class="fa-solid fa-copy flIcon" style="margin-right: 5px !important;"
                    @click.stop="copy(splitString(newsDt['fullText']).title+'\n'+splitString(newsDt['fullText']).content)"></i>

            <div class="getMore" onclick="api.closeWin()">
                <i class="fa-solid fa-arrow-left"></i>&nbsp;&nbsp;

            <div class="subSection flex1 mobileNone" v-if="!isMobile">
                <EChartsGauge class="" />

            </div>
        </ClientOnly>
    </div>
</body>
<script type="text/javascript" src="../script/apiutil.js"></script>
<script src="../script/vue.global.prod.js"></script>
<script src="../api/url.js"></script>
<script src="../script/ajax.js"></script>
<script type="text/javascript">

    //默认主题切换
    let isDark = localStorage.getItem('isDark')
    if (isDark == "true") {
        document.documentElement.classList.add('dark');
    }

    function openUrl(url) {
        if (api.systemType === 'android') {
            // Android平台
            var clipBoard = api.require('clipBoard');
            clipBoard.set({
                value: url
            }, function (ret, err) {
                if (ret) {
                    api.toast({
                        msg: "复制成功,请粘贴到浏览器中打开",
                        location: "middle",
                        global: true
                    });
                } else {
                    api.toast({
                        msg: "复制失败，请重试",
                        location: "middle",
                        global: true
                    });
                }
            });
        } else if (api.systemType === 'ios') {
            // iOS平台
            api.openApp({
                iosUrl: url
            }, function (ret, err) {
                if (err) {
                    console.error('打开浏览器失败：', err);
                }
            });
        }
    }
    apiready = function () {
        //监听主题变换
        api.addEventListener({
            name: 'changeTheme'
        }, function (ret, err) {
            if (ret.value.isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });
        // 创建 Vue 应用
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const newsDt = ref(api.pageParam.item)
                onMounted(() => {
                    //console.log(JSON.stringify(api.pageParam.item));
                });
                //格式化tags
                const getProcessedTags = (tagsString) => {
                    return tagsString.split(/[ ,、]/).filter(tag => tag);
                };
                // 定义格式化日期的方法
                const formatDate = (timestamp) => {
                    if (!timestamp) return '-'; // 处理无效输入

                    const now = new Date(); // 当前时间
                    const time = new Date(timestamp * 1000); // 时间戳转换为毫秒

                    // 获取东八区时间
                    const options = {
                        timeZone: 'Asia/Shanghai',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit'
                    };

                    // 判断是否是今天
                    const isToday = now.toDateString() === time.toDateString();

                    // if (isToday) {
                    //  return time.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Shanghai' });
                    // } else {
                    return time.toLocaleString('zh-CN', options);
                    // }
                };
                const splitString = (input) => {
                    // 检查输入是否为字符串
                    if (typeof input !== 'string') {
                        return { error: '输入必须是字符串' };
                    }

                    // 查找分隔符的位置
                    const separatorIndex = input.indexOf('<->');

                    // 如果找不到分隔符，返回错误
                    if (separatorIndex === -1) {
                        return { error: '未找到分隔符 "<->"', fullText: input };
                    }

                    // 分割字符串为标题和内容
                    let title = input.substring(0, separatorIndex).trim();
                    let content = input.substring(separatorIndex + 3).trim();

                    // 替换连续的换行符为单个换行符
                    title = title.replace(/\n{2,}/g, '\n');
                    content = content.replace(/\n{2,}/g, '\n');

                    // 识别链接并添加点击事件，防止事件穿透
                    const urlRegex = /(https?:\/\/[^\s<]+)/g;
                    content = content.replace(urlRegex, (url) => {
                        // 创建一个包含点击事件的链接元素，防止事件穿透
                        return `<a href="#" onclick="event.stopPropagation(); openUrl('${url}'); return false;">${url}</a>`;
                    });

                    // 返回JSON对象
                    return { title, content };
                };
                const copy = (title, val) => {
                    let cs = title + '\n' + val;
                    var clipBoard = api.require('clipBoard');
                    clipBoard.set({
                        value: cs
                    }, function (ret, err) {
                        if (ret) {
                            api.toast({
                                msg: "复制成功",
                                location: "middle",
                                global: true
                            });
                        } else {
                            api.toast({
                                msg: "复制失败，请重试",
                                location: "middle",
                                global: true
                            });
                        }
                    });
                };
                const openImg = (index, imgUrl) => {
                    api.openWin({
                        name: 'image',
                        url: 'image.html',
                        animation: {
                        type: "movein",                //动画类型（详见动画类型常量）
                        subType: "from_bottom",       //动画子类型（详见动画子类型常量）
                        duration: 300                //动画过渡时间，默认300毫秒
                        },
                        pageParam: {
                        index: index,
                        imgUrl: imgUrl
                        }
                    })
                }
                return {
                    newsDt,
                    getProcessedTags,
                    formatDate,
                    copy,
                    splitString,
                    openImg
                };
            }
        }).mount('#app');
    };
</script>

</html>
