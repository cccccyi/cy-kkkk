<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="maximum-scale=1.0,minimum-scale=1.0,user-scalable=0,initial-scale=1.0,width=device-width" />
    <meta name="format-detection" content="telephone=no,email=no,date=no,address=no">
    <title>Hello APP</title>
    <link rel="stylesheet" type="text/css" href="../../css/apiutil.css" />
    <link href="../../css/fonts6/css/fontawesome.css" rel="stylesheet" />
    <link href="../../css/fonts6/css/solid.css" rel="stylesheet" />
    <link href="../../css/fonts6/css/brands.css" rel="stylesheet" />
    <link href="../../css/fonts6/css/regular.css" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="../../assets/box.css" />
    <link rel="stylesheet" href="../../css/dark.css">
    <style type="text/css">
        html,
        body {
            height: 100%;
        }

        .wrap {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-flex-flow: column;
        }

        header {
            height: 44px;
            width: 100%;
            text-align: center;
            background-color: #0438bc;
            color: #fff;
            line-height: 44px;
            font-size: 18px;
            position: relative;
        }

        .flex-1 {
            -webkit-box-flex: 1;
            -webkit-flex: 1;
        }

        .leftBtn {
            position: absolute;
            text-align: left;
            left: 20px;
            bottom: 0;
            font-size: 20px;
            line-height: 42px;
        }

        .rightBtn {
            position: absolute;
            text-align: right;
            right: 15px;
            bottom: 0;
        }
        @media (max-width: 1100px) {
            .changeItem {
                height: 55px;
                font-size: 14px;
                font-weight: 500;
            }
            .topBar {
                height: 41px;
                width: 100%;
                line-height: 40px !important;
                box-shadow: 0 3px 6px rgba(0, 0, 0, 0.05);
                background-color: white;
                color: #949494;
                font-size: 12px;
            }

            .line1 {
                width: 40px;
                text-align: center;
                color: #656666;
            }

            .line3,
            .line4 {
                text-align: right;
                padding-right: 20px;
              
            }

            .changeItem .line1 {
                line-height: 55px;
            }
            .changeIcon {
                width: 25px;
                height: 25px;
                margin-top: 16px;
                float: left;
                border-radius: 25px;
            }
            .changeTitle {
                margin-left: 10px;
              
            }
            .lineCenter{
                justify-content: center;
                /* 垂直居中 */
                flex-direction: column;
                display: flex;
                line-height: 18px;
            }
            .line2 {
                /* border: solid 1px blue; */
            }
        }
    </style>
</head>

<body class="wrap">
    <header>
        <div class="leftBtn" onclick="api.closeWin()">
            <i class="fa-solid fa-chevron-left"></i>
        </div>
        <span id="name"></span>
        <div class="rightBtn"></div>
    </header>
    
    <div class="topBar setBox">
        <div class="line1">#</div>
        <div class="flex3 getWidth  line2">币种</div>
        <div class="flex4 getWidth  line3" id="hsk">价格 / 涨跌幅</div>
        <div class="flex4 getWidth  line4">24小时交易量</div>
    </div>
    <section class="flex-1">
    </section>
    <footer></footer>
</body>
<script type="text/javascript" src="../../script/apiutil.js"></script>
<script type="text/javascript">
    //默认主题切换
    let isDark = localStorage.getItem('isDark')
    if (isDark == "true") {
        document.documentElement.classList.add('dark');
    }
    apiready = function () {
        let name = api.pageParam.item.name.replace('富途','富途牛牛');
        document.getElementById('name').innerHTML=name;
     
        //监听主题变换
        api.addEventListener({
            name: 'changeTheme'
        }, function (ret, err) {
            if (ret.value.isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });
        //输出Log，Log将显示在 Studio 控制台
        var header = $api.dom('header'); // 获取 header 标签元素
        var footer = $api.dom('footer'); // 获取 footer 标签元素
        //兼容顶栏、底栏
        var headerH = $api.fixStatusBar(header);
        var footerH = $api.fixTabBar(footer);
        let fromHsk = ['胜利证券','哈富证券']
        let isInHsk = fromHsk.includes(name);   // true
        if(!isInHsk){
            api.openFrame({
                name: 'broker_list_frm',
                url: 'broker_list_frm.html',
                bounces: true,
                pageParam: {
                    item: api.pageParam.item
                },
                rect: {
                    marginTop: headerH+40,
                    marginBottom: 0,
                    //   marginBottom: footerH,
                    w: 'auto'
                }
            });
        }else{
            document.getElementById('hsk').innerHTML="价格 / 来源";
            api.openFrame({
                name: 'broker_list_frm',
                url: 'broker_list_frm_hsk.html',
                bounces: true,
                pageParam: {
                    item: api.pageParam.item
                },
                rect: {
                    marginTop: headerH+40,
                    marginBottom: 0,
                    w: 'auto'
                }
            });
        }
    };
</script>
</html>
