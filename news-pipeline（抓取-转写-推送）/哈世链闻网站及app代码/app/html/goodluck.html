<!DOCTYPE HTML>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="maximum-scale=1.0, minimum-scale=1.0, user-scalable=0, initial-scale=1.0, width=device-width" />
  <meta name="format-detection" content="telephone=no, email=no, date=no, address=no">
  <title>Hello APP</title>
  <link rel="stylesheet" type="text/css" href="../css/apiutil.css" />
  <link rel="stylesheet" type="text/css" href="../css/border.css" />
  <link rel="stylesheet" type="text/css" href="../assets/iconfont/iconfont.css" />
  <link rel="stylesheet" type="text/css" href="../assets/box.css" />
  <link href="../css/fonts6/css/fontawesome.css" rel="stylesheet" />
  <link href="../css/fonts6/css/solid.css" rel="stylesheet" />
  <link href="../css/fonts6/css/brands.css" rel="stylesheet" />
  <link href="../css/fonts6/css/regular.css" rel="stylesheet" />
  <link href="../image/goodluck/output/fontkai.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/element-plus.css">
  <link rel="stylesheet" href="../assets/output/font.css">
  <style>
    .ctitle {
      color: #7d0305;
      font-family: KaiTi;
      position: relative;
      top: -20px;
      font-size: 20px;
    }

    .fromBg {
      background-image: url('../image/goodluck/imgBg.webp');
      height: 450px;
      background-size: 100% 100%;
      margin-left: 20px;
      margin-right: 20px;
      padding-top: 50px;
      margin-top: 20px;
      position: relative;
      opacity: 0.8;
    }

    .fromBg .datas {
      width: 90%;
      margin-left: 5%;
    }

    .fromBg .subbtn {
      width: 300px;
      position: absolute;
      bottom: 50px;
      left: 0;
      right: 0;
      margin: 0 auto;
      height: 50px;
      background-image: url('../image/goodluck/button.png');
      background-size: cover;
      cursor: pointer;
    }

    .fromBg .subbtn .subText {
      line-height: 50px;
      font-family: KaiTi;
      font-size: 20px;
      color: #a42123;
      user-select: none;
    }

    .topMsg {
      color: #7d0305;
      font-family: KaiTi;
      font-size: 25px;
      margin: 0 15px 0 15px;
      letter-spacing: -1px;
    }

    .luckPage {
      width: 100%;
      height: 790px;
      width: 100%;
      border-left: solid 1px #bd4849;
      border-right: solid 1px #bd4849;
      background-color: rgba(255, 255, 255, 0.2);
      margin-top: -20px;
      margin-bottom: -100px;
    }

    /* 适配手机样式 */
    @media (max-width: 1100px) {
      .mpd {
        background-image: url('../image/goodluck/bg2.jpg');
        background-size: cover;
        background-position: -40px center;
        margin-bottom: -50px;
      }
    }

    @media (max-width: 1100px) {
      .posterImg {
        top: 0 !important;
      }
    }

    @media (max-width: 1100px) {
      .posterImg .imgBox {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90vw;
        height: auto !important;
        margin-top: 0 !important;
      }
    }

    @media (max-width: 1100px) {
      .posterImg .imgBox img {
        width: 100%;
        height: auto !important;
      }
    }

    @media (max-width: 1100px) {
      .mmhide {
        display: none !important;
      }
    }

    @media (max-width: 1100px) {
      .micons {
        opacity: 0.2 !important;
      }
    }

    @media (max-width: 1100px) {
      .topMsg {
        color: rgb(77, 8, 8) !important;
        font-size: 23px !important;
      }
    }




    @media (max-width: 1100px) {
      .luckPage .fromBg {
        width: 96%;
        margin-left: 2%;
        height: 400px;
      }
    }



    @media (min-width: 1100px) {
      .flashTagsMobile {
        display: none;
      }
    }

    @media (min-width: 1100px) {
      .saveMsg {
        display: none !important;
      }
    }

    .posterImg {
      width: 100vw;
      height: 105vh;
      position: fixed;
      left: 0;
      right: 0;
      margin: 0 auto;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.6);
      touch-action: none; /* 禁止触摸事件导致的滚动 */
    }

    .posterImg .imgBox {
      height: 76vh;
      margin-top: 9vh;
    }

    .posterImg .imgBox img {
      height: 100%;
    }

    .posterBtns {
      width: 180px;
    }

    .posterBtns .btnItem {
      width: 40px;
      height: 40px;
      border: solid 2px white;
      border-radius: 30px;
      margin-top: 20px;
      color: white !important;
      line-height: 37px;
      font-size: 16px !important;
      cursor: pointer;
    }

    .el-form-item__label {
      color: #7d0305;
      /* 修改为您想要的颜色 */
    }

    .el-radio__label {
      color: #7d0305;
      /* 修改为您想要的颜色 */
    }

    .el-input {
      --el-input-border-color: #7d0305;
      --el-input-text-color: #7d0305;
    }

    .el-select {
      --el-text-color: #7d0305;
      --el-input-text-color: #7d0305;
      --el-border-color: #7d0305;
    }

    .pics {
      right: 20px;
      top: 200px;
      width: 450px;
      border: solid 3px white;
      position: fixed;
      background-image: url('../image/goodluck/bg2.jpg');
      background-size: cover;
      overflow: hidden;
     left: -1000px;
    }

    .pics .picsBuild {
      width: calc(100% - 40px);
      margin-left: 20px;
      margin-top: 20px;
      margin-bottom: 20px;
      background-color: rgba(255, 255, 255, 0.6);
      border-radius: 10px;
      overflow: hidden;
    }

    .pics .picsFooter {
      overflow: hidden;
    }

    .pics .picsFooter .ewCode {
      width: 70px;
      float: right;
      position: relative;
      left: 5px;
      bottom: 5px;
    }

    .pics .picsFooter .fimg {
      width: 50%;
      position: relative;
      top: 5px;
    }

    .pics .picsFooter .fimgLogo {
      opacity: 0.7;
      text-align: center;
      font-size: 7px;
    }

    .pics .picsFooter .tips {
      font-size: 6px;
      position: absolute;
      left: 5px;
      bottom: 3px;
      color: #7d0305;
      opacity: 0.7;
    }

    .pics .picsTitle {
      font-size: 30px;
      font-family: p3;
      color: #7d0305;
      overflow: hidden;
      margin-left: 20px;
    }

    .pics .picsX {
      margin-top: -55px;
      font-size: 27px;
      color: #7d0305;
      overflow: hidden;
    }

    .pics .picsX .xiCon {
      width: 55px;
      border-radius: 50px;
      border: solid 2px white;
      float: left;
      margin-left: 10px;
      margin-top: 25px;
    }

    .pics .picsX .xName {
      margin-top: 30px;
      margin-left: 10px;
      display: inline-block;
      font-weight: bold;
      /* font-family: p3; */
    }

    .pics .picsMsg {
      font-size: 20px;
      word-break: break-all;
      padding: 20px;
      padding-top: 10px;
      line-height: 30px;
      letter-spacing: 1px;
      color: #af3d3f;
      margin-top: -30px;
      font-family: p3;
      font-weight: lighter;
    }

    .pics .picsIcon {
      position: absolute;
      top: -30px;
      z-index: -1;
      right: 0;
      opacity: 0.2;
      font-family: p3;
      font-size: 80px;
      padding: 0;
    }

    .pics .picsLaicai {
      float: left;
      width: 50px;
      position: relative;
      top: -2px;
    }
    .ptIcon{
      font-size: 20px !important;
      line-height: 40px !important;
    }
    .fade-enter-active, .fade-leave-active {
      transition: opacity 0.5s ease;
    }
    .fade-enter-from, .fade-leave-to {
      opacity: 0;
    }
    .fade-enter-to, .fade-leave-from {
      opacity: 1;
    }

    [v-cloak] {
      display: none;
    }
  </style>
</head>
<body id="app">
  <!-- 海报模版，隐藏状态 -->
  <div class="pics" ref="picsRef">
    <!-- <img src="@/assets/cbtc_g.png" class="picsIcon" alt=""> -->
    <center>
      <span class="picsIcon">
        ${{form.coin}}
      </span>
    </center>
    <div class="picsBuild">
      <div class="picsX" v-if="userDt.name">
        <br>
        <img :src="userDt.profile_image_url" class="xiCon" alt="">
        <!-- <img src="@/assets/laicai.png" class="xiCon" alt=""> -->
        <span class="xName">
          {{userDt.name}}:
          <!-- 凉兮大将军: -->
        </span>
      </div>
      <div style="height: 20px ;" v-if="!userDt.name"></div>
      <div class="picsTitle">
        <!-- <img src="@/assets/laicai.png" class="picsLaicai" alt=""> -->
        我给<span style="
            font-family: sans-serif;
            font-size: 25px;
            font-weight: bold;
            position: relative;
            top:-2px;
          ">
          "${{form.coin}}"
        </span>算了一卦！
      </div>
      <div class="picsMsg">
        <br>
        {{fdata.coinAndMe}}
        <br>
        总结：{{fdata.talk}}
      </div>
      <div class="picsFooter">
        <div class="ewCode">
          <center>
            <img src="../assets/xlink.png" class="fimg" alt="">
            <p class="fimgLogo">扫码免费测算</p>
          </center>
        </div>
        <p class="tips">*测算结果仅供娱乐，不作为真实投资建议</p>
      </div>
    </div>
  </div>
  <!-- 海报弹窗 -->
  <transition name="fade">
    <div class="posterImg" v-if="posterShow" >
      <center>
        <div class="imgBox">
          <img :src="posterImg" alt="生成的海报" @click.stop="" />
          <!-- <img src="../image/03.png" alt="生成的海报" @click.stop="" /> -->
          <div class="posterBtns setBox">
            <div class=" flex1">
              <center>
             
                  <div class="btnItem" @click.stop="saveImg()">
              
                    <i class="fa-solid fa-floppy-disk ptIcon"></i>
                  </div>
           
              </center>
            </div>
            <div class=" flex1">
              <center>
                <div class="btnItem" @click="closePoster()">
                  <i class="fa-solid fa-xmark ptIcon"></i>
                </div>
              </center>
            </div>
          </div>
        </div>
      </center>
    </div>
  </transition>
  <div class="mpd" v-cloak>
    <div class="luckPage">
      <div class="topMsg">
        <br>
        <span>何为“来财”？</span>
        <br>
        以周易为基，融合财爻卦象，洞察命理与市场的微妙联系，揭示投资的契机与风险。周易定势，财爻点睛，天机已现，一测便知！
      </div>
      <div class="from">
        <div class="fromBg">

          <center>
            <span class="ctitle">请输入测算所需信息</span>
          </center>
          <el-form :model="form" :rules="rules" label-width="auto" class="datas" ref="formRef">
            <el-form-item label="代币名称" prop="coin">
              <el-input v-model="form.coin" id="search-key-word-input-wrapper" placeholder="请输入感兴趣的代币名称" />
            </el-form-item>
            <el-form-item label="所属公链">
              <el-select v-model="form.chain" placeholder="请选择代币所属链">
                <el-option v-for="item in chainList" :label="item" :value="item" />
              </el-select>
            </el-form-item>
            <el-form-item label="推特用户名">
              <el-input v-model="form.username" placeholder="填写后生成专属测算海报" />
            </el-form-item>
            <el-form-item label="农历生日" prop="birth">
              <el-date-picker :editable="false" style="width:100%" v-model="form.birth" type="date" placeholder="选择日期">
              </el-date-picker>
            </el-form-item>
            <el-form-item label="您的性别">
              <el-radio-group v-model="form.gender">
                <el-radio value="男">男</el-radio>
                <el-radio value="女">女</el-radio>
              </el-radio-group>
            </el-form-item>
            <div class="subbtn" @click="gooluck()">
              <center>
                <span class="subText">
                  提交测算
                </span>
              </center>
            </div>
          </el-form>

        </div>
      </div>
    </div>
  </div>
</body>
<script type="text/javascript" src="../script/apiutil.js"></script>
<script src="../script/vue.global.prod.js"></script>
<script src="../script/element-plus.js"></script>
<script src="../script/zh-cn.js"></script>
<script src="../api/url.js"></script>
<script src="../script/ajax.js"></script>
<script src="../script/html2canvas.min.js"></script>
<script type="text/javascript">
  // window.zhCn = ElementPlus.locale.zhCn
  apiready = function () {
    // 创建 Vue 应用
    const { createApp, ref, onMounted, reactive, nextTick } = Vue;
    const app = createApp({
      setup() {
        const loading = Vue.ref(false);
        onMounted(() => {
          // alert(1)
          //测算信息

        });
        //海报相关
        let posterMsg = ref({});
        let posterShow = ref(false);
        let posterImg = ref(""); // 存储生成的图片
        const picsRef = ref(null); // 获取 poster 组件的引用
        const formRef = ref(null);
        let fdata = ref({})
        let userDt = ref({})
        const form = reactive({
          coin: '',
          chain: '',
          username: '',
          birth: '',
          gender: '',
          address: ''
        })
        //表单验证规则
        const rules = ref({
          coin: [
            { required: true, message: '代币名称为必填项', trigger: 'blur' }
          ],
          birth: [
            { required: true, message: '生日为必填项', trigger: 'change' }
          ]
        });
        const chainList = ref([
          'Ordinals', 'Runes', 'BTC', 'ETH', 'BSC', 'SOLANA', 'TRON', 'BASE', 'Lightning Network', 'Arbitrum', 'Optimism', 'Linea', 'Polygon', 'Sui', 'Avalanche', '其他EVM生态', '其他BTC生态'
        ])
        const saveImg = () => {
       //   console.log();
          var trans = api.require('trans');
          let base64Data = posterImg.value.replace(/^data:image\/\w+;base64,/, "");
          trans.saveImage({
              base64Str: base64Data,
              imgPath: "fs://img/",
              imgName: "goodluck.png"
          }, function(ret, err) {
              if (ret.status) {
                api.saveMediaToAlbum({
                    path: "fs://img/goodluck.png"
                }, function(ret2, err2) {
                    if (ret2 && ret2.status) {
                        api.toast({ msg: "已保存到系统相册", location: "middle" });
                    } else {
                        api.toast({ msg: "保存失败，请重试", location: "middle" });
                    }
                });
              } else {
                  api.alert({
                      msg: JSON.stringify(err)
                  })
              }
          });
        }
        //提交表单
        const gooluck = async (item) => {
          //  alert(1);
          console.log('formRef:', formRef.value);

          const valid = await formRef.value?.validate();
          console.log('formRef:', formRef.value);

          if (valid) {
            // api.showProgress()
            api.showProgress({
              title: '正在解卦...',
              text: '望君耐心等候',
              modal: true
            });

            userDt.value = {}

            postAction(form, _URL.doDivination, (jData) => {
              let jtext = extractJsonFromString(jData.result)
              fdata.value = JSON.parse(jtext);
              console.log(JSON.stringify(fdata.value));
              api.showProgress({
                title: '此卦已解✓',
                text: '正在生成海报',
                modal: true
              });
              //如果有用户名的话，查一下头像和昵称
              if (form.username) {
                let requestData = {
                  username: form.username,
                };
                getAction(requestData, _URL.getTweetProfileImageByName, (user) => {
                  console.log(JSON.stringify(user));
          
                  if (user.data) {
                    userDt.value = user.data;
                  }
                  nextTick(() => {
                    showPoster()
                  });
                })
              } else {
                nextTick(() => {
                  showPoster()
                });
              }
            })
              //下面是测试用的
              // fdata.value = {"coinAndMe":"币海风云瞬息变，持币心中莫担忧。牛鬼蛇神随波走，笑看涨跌把舵游。","talk":"买入如投江湖水，涨跌难测且行且珍惜！"} 
              // api.showProgress({
              //   title: '此卦已解✓',
              //   text: '正在生成海报',
              //   modal: true
              // });
              // //如果有用户名的话，查一下头像和昵称
              // if (form.username) {
              //   let requestData = {
              //     username: form.username,
              //   };
              //    userDt.value = {"username":"zhaoqifeifei","profile_image_url":"https://pbs.twimg.com/profile_images/1712338400580403200/dFE502i3_normal.jpg","id":"1542369273158705159","name":"haha（❤️$DOG）"}
             
              //     nextTick(() => {
              //       showPoster()
              //     });
                
              // } else {
              //   nextTick(() => {
              //     showPoster()
              //   });
              // }
           
          }
        };
        const showPoster = () => {
          html2canvas(picsRef.value, {
            scale: 3, // 提高清晰度，2-3倍比较合适
            useCORS: true, // 允许跨域图片
            backgroundColor: null, // 背景透明
          }).then((canvas) => {
            posterImg.value = canvas.toDataURL("image/png"); // 生成 base64 高清图片
            posterShow.value = true;
            api.hideProgress();
          });
        };
        // 提取 JSON 字符串的方法
        const extractJsonFromString = (str) => {
          const start = str.indexOf('{');
          const end = str.lastIndexOf('}');
          if (start !== -1 && end !== -1) {
            return str.slice(start, end + 1);
          }
          return null;
        };
        //判断能否转成JSON
        const isJsonString = (str) => {
          try {
            const json = JSON.parse(str);
            return json;
          } catch (e) {
            return false;
          }
        }
        //关闭海报
        const closePoster = (item) => {
            posterShow.value = false;
            qrData.value = '';
            posterImg.value = '';
            posterMsg.value = {}
        }
        // 设置全局语言为中文
        //  ElementPlus.locale(window.zhCn);
        return {
          form,
          rules,
          chainList,
          gooluck,
          posterMsg,
          posterShow,
          posterImg,
          picsRef,
          formRef,
          fdata,
          userDt,
          closePoster,
          saveImg
        };
      }
    })
    app.use(ElementPlus, {
      locale: ElementPlusLocaleZhCn,
    })
    app.mount("#app");
  };
</script>

</html>
