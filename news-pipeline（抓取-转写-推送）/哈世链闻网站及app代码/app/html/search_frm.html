<script type="text/javascript">
 //默认主题切换
 let isDark =  localStorage.getItem('isDark')
  if(isDark=="true"){
    document.documentElement.classList.add('dark');
  }
    apiready = function () {
          //监听主题变换
    api.addEventListener({
        name: 'changeTheme'
    }, function(ret, err) {
      if(ret.value.isDark){
        document.documentElement.classList.add('dark');
      }else{
        document.documentElement.classList.remove('dark');
      }
    });
        // 创建 Vue 应用
        const { createApp, ref, onMounted ,nextTick} = Vue;
        createApp({
            setup() {
                const pageNum = ref(1)
                const pageSize = ref(20)
                const list = ref([])   //快讯列表
                const keyword = ref(api.pageParam.keyword)// 搜索关键字 
                const loading = ref(false);
                const nodata = ref(false);
                const sLoading = ref(false);
                const end = ref(false);

                //海报相关的 
                let posterMsg = ref({});
                let posterShow = ref(false);
                let posterImg = ref(""); // 存储生成的图片
                const picsRef = ref(null); // 获取 poster 组件的引用
                onMounted(() => {
                    //激活下拉刷新
                    const frames = [];
                    for (let i = 0; i <= 89; i++) {
                        const paddedNumber = i.toString().padStart(3, '0');
                        frames.push(`widget://frames/frame-${paddedNumber}.png`);
                    }
                    api.setCustomRefreshHeaderInfo({
                        bgColor: 'rbga(0,0,0,0)',
                        loadAnimInterval: '6',
                        isScale: false,
                        image: {
                            //下拉过程中
                            pull: frames,
                            //加载过程中
                            load: frames
                        }
                    }, function () {
                        //获取数据
                        //重置个别状态
                        nodata.value = false;
                        end.value = false;
                        loading.value = false;
                        pageNum.value = 1;
                        getList('set', 'refresh')
                    });
                    //获取数据
                    getList('set')
                    //监听页面滚动到底部
                    api.addEventListener({
                        name: 'scrolltobottom',
                        extra: {
                            threshold: 0 // 设置距离底部多少距离时触发，默认值为0
                        }
                    }, function (ret, err) {
                        if (!loading.value) {
                            //锁定
                            loading.value = true
                            pageNum.value++
                            setTimeout(() => {
                                getList('add')
                            }, 100)
                        }
                    });

                });
                //监听滚动到底部
                //获取快讯列表
                const getList = (type, isf) => {
                    let requestData = {
                        pageNum: pageNum.value,
                        pageSize: pageSize.value,
                        keyword: keyword.value
                    }
                    getAction(requestData, _URL.news_list, (responseData) => {
                        console.log(JSON.stringify(responseData));
                        if(responseData.code=='0'){
                            //网不好
                            api.toast({
                                msg:'网络异常',
                                location: "middle",
                                global:true
                            })
                        }
                        //  console.log(JSON.stringify(responseData));
                        if(isf == 'refresh'){
                            api.refreshHeaderLoadDone()
                        }
                        let response = responseData.data.list;
                        //关锁，滚动到底部
                        loading.value = false
                        //第二把锁，搜索
                        sLoading.value = false
                        //一上来就没数据说明一条都没有
                        if (responseData.data.total == 0 && pageNum.value == 1) {
                            nodata.value = true
                        }
                        //说明加载完了
                        if (responseData.data.list.length == 0 && pageNum.value > 1) {
                            end.value = true
                            //再打开锁，防止一直请求空数据
                            loading.value = true
                        }
                        //说明第一页就加载完了
                        if (responseData.data.list.length == responseData.data.total) {
                            end.value = true
                            //再打开锁，防止一直请求空数据
                            loading.value = true
                        }
                        type == 'set' ? list.value = response : list.value.push(...response);
                    })
                }
                const search = () => {
                    if (!sLoading.value) {  //使加载过程中点击无效
                        //初始化所有状态
                        nodata.value = false;
                        end.value = false;
                        loading.value = false;
                        pageNum.value = 1;
                        list.value = []
                        //开启搜索锁
                        sLoading.value = true;
                        getList('set');
                    }
                }
                const goDt = (item) => {
                    api.openWin({
                        name: 'newsDt',
                        url: 'newsDt.html',
                        pageParam: {
                            uniqueCode:item.uniqueCode,
                            type: 'search'
                        }
                    })
                }
                const copy = (title, val) => {
                    let cs = title + '\n' + val;
                    var clipBoard = api.require('clipBoard');
                    clipBoard.set({
                        value: cs
                    }, function (ret, err) {
                        if (ret) {
                            api.toast({
                                msg: "复制成功",
                                location: "middle",
                                global: true
                            });
                        } else {
                            api.toast({
                                msg: "复制失败，请重试",
                                location: "middle",
                                global: true
                            });
                        }
                    });
                }
                // 处理时间显示，列表中的
                const formatDate = (timestamp) => {

                    if (!timestamp) return { time: '-', date: '' }; // 处理无效输入

                    const now = new Date(); // 当前时间
                    const time = new Date(timestamp * 1000); // 时间戳转换为毫秒

                    // 辅助函数：确保数字为两位数
                    function padZero(num) {
                        return num < 10 ? '0' + num : num;
                    }

                    // 获取时间部分（24小时制）
                    const hours = padZero(time.getHours());
                    const minutes = padZero(time.getMinutes());
                    const formattedTime = `${hours}:${minutes}`;

                    // 判断是否是今天
                    const isToday = now.toDateString() === time.toDateString();

                    if (isToday) {
                        // 今天只显示时间（时:分）
                        return {
                            time: formattedTime,
                            date: ''
                        };
                    } else {
                        // 非今天显示日期（月-日）和时间（时:分）
                        const month = padZero(time.getMonth() + 1);
                        const day = padZero(time.getDate());
                        const formattedDate = `${month}/${day}`;

                        return {
                            time: formattedTime,
                            date: formattedDate
                        };
                    }
                }
                //格式化tags
                const getProcessedTags = (tagsString) => {
                    return tagsString.split(/[ ,、]/).filter(tag => tag);
                };

                //处理时间显示，海报中的
                const showPoster = (item) => {
                    posterMsg.value = item;
                    nextTick(() => {
                        html2canvas(picsRef.value, {
                            scale: 1, // 提高清晰度，2-3倍比较合适
                            useCORS: true, // 允许跨域图片
                            backgroundColor: null, // 背景透明
                        }).then((canvas) => {
                            posterImg.value = canvas.toDataURL("image/png"); // 生成 base64 高清图片
                            posterShow.value = true;
                        });
                    });
                }
                //关闭海报
                const closePoster = (item) => {
                    posterShow.value = false;
                    posterImg.value = '';
                    posterMsg.value = {}
                }
                //保存图片
                const saveImg = () => {
                    var trans = api.require('trans');
                    let base64Data = posterImg.value.replace(/^data:image\/\w+;base64,/, "");
                    trans.saveImage({
                        base64Str: base64Data,
                        imgPath: "fs://img/",
                        imgName: posterMsg.value.title + '.png'
                    }, function (ret, err) {
                        if (ret.status) {
                            api.saveMediaToAlbum({
                                path: "fs://img/" + posterMsg.value.title + '.png'
                            }, function (ret2, err2) {
                                if (ret2 && ret2.status) {
                                    api.toast({ msg: "已保存到系统相册", location: "middle" });
                                } else {
                                    api.toast({ msg: "保存失败，请重试", location: "middle" });
                                }
                            });
                        } else {
                            api.alert({
                                msg: JSON.stringify(err)
                            })
                        }
                    });
                }
                const formatDateImg = (timestamp) => {
                    if (!timestamp) return '-'; // 处理无效输入

                    const time = new Date(timestamp * 1000); // 转换为毫秒级时间戳

                    // 获取年、月、日、小时、分钟，确保东八区时间
                    const dateFormatter = new Intl.DateTimeFormat('zh-CN', {
                        timeZone: 'Asia/Shanghai',
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: false // 使用24小时制
                    });

                    // 获取星期
                    const weekdayFormatter = new Intl.DateTimeFormat('zh-CN', {
                        timeZone: 'Asia/Shanghai',
                        weekday: 'long'
                    });

                    const formattedDate = dateFormatter.format(time).replace(/\//g, '-'); // 转换成 YYYY-MM-DD 格式
                    const weekday = weekdayFormatter.format(time); // 获取星期几

                    return `${formattedDate} ${weekday}`;
                };
                return {
                    copy,
                    list,
                    formatDate,
                    getProcessedTags,
                    goDt,
                    search,
                    keyword,
                    nodata,
                    sLoading,
                    end,
                    posterMsg,
                    formatDateImg,
                    showPoster,
                    posterShow,
                    closePoster,
                    posterImg,
                    picsRef,
                    saveImg
                };
            }
        }).mount('#app');
    };
</script>

</html>
