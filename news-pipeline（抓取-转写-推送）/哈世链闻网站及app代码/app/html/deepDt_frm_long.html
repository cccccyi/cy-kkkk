<script type="text/javascript">

    apiready = function () {
        //监听主题变换

        }, function (ret, err) {
            if (ret.value.isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });
        // 创建 Vue 应用
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const newsDt = ref(api.pageParam.item)
           

                console.log(JSON.stringify(newsDt.value))
                onMounted(() => {

                    // if (typeof document !== 'undefined') {

                    //     processedContent.value = processRichText(newsDt.value.content);
                    // }
                });
                const processRichText = (content) => {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = content;

                    // 去除超链接
                    // const links = tempDiv.querySelectorAll('a');

                    //     while (link.firstChild) {

                    //     }
                    //     link.parentNode.removeChild(link);
                    // });

                    // 为图片添加类名，并添加点击事件
                    const images = tempDiv.querySelectorAll('img');
                    images.forEach(img => {
                        img.classList.add('custom-img2');
                        img.setAttribute('onclick', `test('${img.src}')`);
                    });
                    // 替换 h1 到 h6 标签为 p 标签，并在前面加上换行，且加粗
                    // const headers = tempDiv.querySelectorAll('h1, h2, h3, h4, h5, h6');
                    // headers.forEach(header => {
                    //     const newParagraph = document.createElement('p');
                    //     newParagraph.textContent = header.textContent;
                    //     newParagraph.style.fontWeight = 'bold'; // 设置加粗

                    //     // 在新生成的 p 标签前面加上换行符
                    //     const br = document.createElement('br');
                    //     header.parentNode.insertBefore(br, header);
                    //     header.parentNode.insertBefore(newParagraph, header.nextSibling);

                    //     header.parentNode.removeChild(header);
                    // });

                    // 处理所有的 figcaption 标签
                    // const figcaptions = tempDiv.querySelectorAll('figcaption');
                    // figcaptions.forEach(figcaption => {
                    //     const newParagraph = document.createElement('p');
                    //     newParagraph.textContent = figcaption.textContent;
                    //     newParagraph.style.fontSize = '13px'; // 设置字体大小为 13px
                    //     newParagraph.style.color = 'rgb(160,160,160)';    // 设置颜色为灰色
                    //     newParagraph.style.fontStyle = 'italic'; // 设置文字倾斜
                    //     newParagraph.style.lineHeight = '20px'; // 设置行高为 20px
                    //     newParagraph.style.textAlign = 'center'; // 设置文字居中
                    //     newParagraph.style.width = '90%';
                    //     newParagraph.style.marginLeft = '5%';

                    //     // 替换 figcaption 标签为新的 p 标签
                    //     figcaption.parentNode.replaceChild(newParagraph, figcaption);

                    //     // 在新的 p 标签后面添加一个换行符
                    //     const br = document.createElement('br');
                    //     newParagraph.parentNode.insertBefore(br, newParagraph.nextSibling);
                    // });

                    return tempDiv.innerHTML;
                };
                //格式化tags
                const getProcessedTags = (tagsString) => {
                    return tagsString.split(/[ ,、]/).filter(tag => tag);
                };
                // 定义格式化日期的方法
                const formatDate = (timestamp) => {

                    if (!timestamp) return { time: '-', date: '' }; // 处理无效输入

                    const now = new Date(); // 当前时间
                    const time = new Date(timestamp * 1000); // 时间戳转换为毫秒

                    // 辅助函数：确保数字为两位数
                    function padZero(num) {
                        return num < 10 ? '0' + num : num;
                    }

                    // 获取时间部分（24小时制）
                    const hours = padZero(time.getHours());
                    const minutes = padZero(time.getMinutes());
                    const formattedTime = `${hours}:${minutes}`;

                    // 判断是否是今天
                    const isToday = now.toDateString() === time.toDateString();

                    if (isToday) {
                        // 今天只显示时间（时:分）
                        return {
                            time: formattedTime,
                            date: ''
                        };
                    } else {
                        // 非今天显示日期（月-日）和时间（时:分）
                        const month = padZero(time.getMonth() + 1);
                        const day = padZero(time.getDate());
                        const formattedDate = `${month}/${day}`;

                        return {
                            time: formattedTime,
                            date: formattedDate
                        };
                    }
                }
                const goSearch = (val) => {
                    api.openWin({
                        name: 'search',
                        url: 'search.html',
                        pageParam: {
                            keyword: val
                        }
                    })
                }
                // const removeEmptyLines = (text) => {
                //     return text
                //     .split('\n')          // 按行拆分
                //     .map(line => line.trim()) // 去掉每行首尾空格
                //     .filter(line => line.length > 0) // 只保留非空行
                //     .join('\n');          // 再拼接成字符串
                // }
                const cleanRichText = (text) => {
  // 1️⃣ 按行拆分、去掉空行
  const lines = text
    .split('\n')
    .map(line => line.trim())        // 去掉首尾空格
    .filter(line => line.length > 0) // 只保留非空行

  // 2️⃣ 去掉第一行
  lines.shift(); // 删除数组第一个元素

  // 3️⃣ 拼接回字符串
  return lines.join('\n');
}


                const toBeijingTime =(utcString) => {
                    const date = new Date(utcString);

                    // 北京时间 = UTC + 8 小时
                    const beijing = new Date(date.getTime() + 8 * 60 * 60 * 1000);

                    const MM = String(beijing.getMonth() + 1).padStart(2, '0');
                    const DD = String(beijing.getDate()).padStart(2, '0');
                    const HH = String(beijing.getHours()).padStart(2, '0');
                    const mm = String(beijing.getMinutes()).padStart(2, '0');

                    return `${MM}-${DD} ${HH}:${mm}`;
                }
                const copy = (title, val) => {
                    let cs = title + '\n' + val;
                    var clipBoard = api.require('clipBoard');
                    clipBoard.set({
                        value: cs
                    }, function (ret, err) {
                        if (ret) {
                            api.toast({
                                msg: "复制成功",
                                location: "middle",
                                global: true
                            });
                        } else {
                            api.toast({
                                msg: "复制失败，请重试",
                                location: "middle",
                                global: true
                            });
                        }
                    });
                }
                const openImg = (index, imgUrl) => {
                    api.openWin({
                        name: 'image',
                        url: 'image.html',
                        animation: {
                            type: "movein",                //动画类型（详见动画类型常量）
                            subType: "from_bottom",       //动画子类型（详见动画子类型常量）
                            duration: 300                //动画过渡时间，默认300毫秒
                        },
                        pageParam: {
                            index: index,
                            imgUrl: imgUrl
                        }
                    })
                }
                return {
                    newsDt,
                    getProcessedTags,
                    formatDate,
                    copy,
                    processRichText,
                    goSearch,
                    toBeijingTime,
                    cleanRichText,
                    openImg
                };
            }
        }).mount('#app');
   };
    function test(val) {

        let imgUrl = [val];
        api.openWin({
            name: 'image',

            animation: {

</script>
