# 开发环境配置
app:
  prefix: ''
  port: 8088
  logger:
    # 项目日志存储路径，相对路径（相对本项目根目录）或绝对路径
    dir: '../logs'
  # 文件相关
  file:
    # 是否为本地文件服务或cos
    isLocal: true
    # location 文件上传后存储目录，相对路径（相对本项目根目录）或绝对路径
    location: '../upload'
    # 文件服务器地址，这是开发环境的配置 生产环境请自行配置成可访问域名
    domain: 'http://localhost:8080'
    # 文件虚拟路径, 必须以 / 开头， 如 http://localhost:8080/profile/****.jpg  , 如果不需要则 设置 ''
    serveRoot: '/profile'
    # 文件大小限制，单位M
    maxSize: 10
# 腾讯云cos配置
cos:
  secretId: ''
  secretKey: ''
  bucket: ''
  region: ''
  domain: ''
  location: ''
# 数据库配置
db:
  mysql:
    host: '82.157.161.88'
    username: 'root'
    password: ''
    database: 'block_chain'
    port: 3306
    charset: 'utf8mb4'
    logger: 'file'
    logging: true
    multipleStatements: false
    dropSchema: false
    synchronize: false
    supportBigNumbers: true
    bigNumberStrings: true

# redis 配置
redis:
  host: '82.157.161.88'
  password: ''
  port: 6379
  db: 2
  keyPrefix: ''

# jwt 配置
jwt:
  secretkey: ''
  expiresin: '1h'
  refreshExpiresIn: '2h'
# 权限 白名单配置
perm:
  router:
    whitelist:
      [
        { path: '/captchaImage', method: 'GET' },
        { path: '/registerUser', method: 'GET' },
        { path: '/register', method: 'POST' },
        { path: '/login', method: 'POST' },
        { path: '/logout', method: 'POST' },
        { path: '/perm/{id}', method: 'GET' },
        { path: '/upload', method: 'POST' },
        { path: '/media/news/list', method: 'GET' },
        { path: '/media/news/category/statistic', method: 'GET' },
        { path: '/media/news/:id', method: 'GET' },
        { path: '/media/article/list', method: 'GET' },
        { path: '/media/article/category/statistic', method: 'GET' },
        { path: '/media/article/:id', method: 'GET' },
        { path: '/media/tweet/list', method: 'GET' },
        { path: '/media/tweet/category/statistic', method: 'GET' },
        { path: '/media/tweet/:id', method: 'GET' },
        { path: '/media/coinglass/hyperliquid', method: 'GET' },
        { path: '/media/coinglass/statistic', method: 'GET' },
        { path: '/media/coinglass/action', method: 'GET' },
        { path: '/media/coinglass/userfills', method: 'GET' },
        { path: '/media/coinglass/feargreedindex', method: 'GET' },
        { path: '/media/coinglass/longshortRatio', method: 'GET' },
        { path: '/media/coinglass/altcoinSeason', method: 'GET' },
        { path: '/media/coinglass/turnover', method: 'GET' },
        { path: '/media/coinglass/coinankStatistic', method: 'GET' },
        { path: '/media/coinglass/fundingRate', method: 'GET' },
        { path: '/rss/news', method: 'GET' },
        { path: '/rss/article', method: 'GET' },
        { path: '/app/version', method: 'GET' },
        { path: '/app/deviceInfo', method: 'POST' },
      ]

# 用户相关
# 初始密码， 重置密码
user:
  initialPassword: ''
