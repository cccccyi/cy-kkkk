<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>快讯管理</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="../../lib/layui-v2.5.5/css/layui.css" media="all">
    <link rel="stylesheet" href="../../css/public.css" media="all">
</head>

<body>
    <div class="layuimini-container" id="app">
        <div class="layuimini-main">
            <fieldset class="table-search-fieldset">
                <legend>搜索信息</legend>
                <div style="margin: 10px 10px 10px 10px">
                    <form class="layui-form layui-form-pane" action="">
                        <div class="layui-form-item">
                            <div class="layui-inline">
                                <div class="layui-input-inline">
                                    <input type="text" name="keyword" autocomplete="off" class="layui-input"
                                        placeholder="关键字搜索">
                                </div>
                            </div>

                            <div class="layui-inline">
                                <button type="submit" class="layui-btn layui-btn-primary" lay-submit
                                    lay-filter="data-search-btn" id="searchs"><i class="layui-icon"></i> 搜 索</button>
                            </div>
                        </div>
                    </form>
                </div>
            </fieldset>
            <table class="layui-hide" id="currentTableId" lay-filter="currentTableFilter"></table>
        </div>
    </div>
    <script type="text/html" id="toolbarDemo">
        <div class="layui-btn-container">
            <button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="add">新增快讯</button>
        </div>
    </script>
    <script type="text/html" id="currentTableBar">
        <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="edit">编辑</a>
         {{#  if(d.del_flag =='0' ){ }}
	<a class="layui-btn layui-btn-warm layui-btn-xs" lay-event="hide">隐藏</a>
	    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="delete">删除</a>
	    {{#  } else { }}
	    <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="show">显示</a>
	    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="delete">删除</a>
	    {{#  } }}
    </script>
    <script src="../../lib/layui-v2.5.5/layui.js" charset="utf-8"></script>
    <script src="../../api/jquery.js"></script>
    <script src="../../api/request.js" type="text/javascript" charset="utf-8"></script>
    <script src="../../api/url.js" type="text/javascript" charset="utf-8"></script>
    <script src="../../js/vue.js" type="text/javascript" charset="utf-8"></script>
    <script>
        var App = new Vue({
            el: '#app',
            data: {
                account: ''
            },
            mounted: function () {
                let that = this;
            },
            methods: {
                //模拟点击刷新当前表格数据，给添加时的弹窗用的
                reloadData() {
                    //当前页的刷新
                    $("#searchs")[0].click();
                }
            },
            created: function () {
                let that = this;
                layui.use(['form', 'table'], function () {
                    var $ = layui.jquery,
                        form = layui.form,
                        table = layui.table;
                    table.render({
                        elem: '#currentTableId',
                        url: _URL.news,
                        where: {

                        },
                        headers: {
                            'Authorization': 'Bearer ' + localStorage.getItem('t')
                        },
                        parseData: function (res) { //将原始数据解析成 table 组件所规定的数据
                            console.log('API返回数据:', res); // 调试日志
                            return {
                                "code": '1', //返回状态码
                                "msg": 'success', //解析提示信息
                                "count": res.pagination?.total || 0, //数据总条数（从pagination中获取）
                                "data": res.data || [] //解析数据列表
                            };
                        },
                        response: {
                            statusCode: true //规定成功的状态码，默认：0
                        },
                        toolbar: '#toolbarDemo',
                        cols: [[
                            { title: '标题', field: 'title', width: 300 },
                            { title: '内容', field: 'content' },
                            { title: '标签', field: 'tags', width: 150 },
                            { title: '主分类', field: 'primary_category', width: 80 },
                            {
                                field: 'publish_time', title: '发布时间', width: 170, sort: true, templet: function (d) {
                                    if (!d.publish_time) return '-';
                                    console.log('原始publish_time:', d.publish_time, typeof d.publish_time);

                                    var date;
                                    // 尝试不同的时间戳格式
                                    if (typeof d.publish_time === 'string') {
                                        // 如果是字符串，尝试直接解析
                                        date = new Date(d.publish_time);
                                    } else if (typeof d.publish_time === 'number') {
                                        // 如果是数字，检查是否是秒级时间戳
                                        if (d.publish_time < 10000000000) {
                                            // 秒级时间戳，转换为毫秒
                                            date = new Date(d.publish_time * 1000);
                                        } else {
                                            // 毫秒级时间戳
                                            date = new Date(d.publish_time);
                                        }
                                    } else {
                                        return d.publish_time; // 无法识别的格式，直接返回
                                    }

                                    // 检查日期是否有效
                                    if (isNaN(date.getTime())) {
                                        console.log('无效的日期:', d.publish_time);
                                        return d.publish_time; // 返回原始值
                                    }

                                    var formattedDate = date.getFullYear() + '-' +
                                        String(date.getMonth() + 1).padStart(2, '0') + '-' +
                                        String(date.getDate()).padStart(2, '0') + ' ' +
                                        String(date.getHours()).padStart(2, '0') + ':' +
                                        String(date.getMinutes()).padStart(2, '0') + ':' +
                                        String(date.getSeconds()).padStart(2, '0');

                                    console.log('转换后的时间:', formattedDate);
                                    return formattedDate;
                                }
                            },
                            {
                                title: '操作',
                                toolbar: '#currentTableBar',
                                align: "center",
                                fixed: 'right',
                                width: 200
                            }
                        ]],
                        page: true, //开启分页
                        limit: 10, //默认每页显示的条数
                        limits: [10, 20, 50, 100], //每页条数的选择项
                        //自定义分页参数
                        request: {
                            pageName: 'page', // page
                            limitName: 'limit' // limit
                        },
                        skin: 'line',
                        done: function (res, curr, count) {
                            layer.closeAll('loading');
                            // 遍历所有行，根据push_flag设置整行颜色
                            layui.each($('#currentTableId').next().find('tbody tr'), function (index, item) {
                                var dataIndex = $(this).data('index');
                                var rowData = res.data[dataIndex];
                                if (rowData && rowData.push_flag === 'y') {
                                    $(this).css('color', '#002fa7');
                                }
                            });
                        }
                    });

                    // 监听搜索操作
                    form.on('submit(data-search-btn)', function (data) {
                        //执行搜索重载
                        table.reload('currentTableId', {
                            page: {
                                curr: 1
                            }, where: data.field
                        });
                        return false;
                    });

                    /**
                     * toolbar监听事件
                     */
                    table.on('toolbar(currentTableFilter)', function (obj) {
                        if (obj.event === 'add') {  // 监听添加操作
                            var index = layer.open({
                                title: '新增快讯',
                                type: 2,
                                shade: 0.2,
                                maxmin: true,
                                shadeClose: true,
                                area: ['80%', '90%'],
                                content: './add.html',
                            });
                        }
                    });
                    //监听每行操作
                    table.on('tool(currentTableFilter)', function (obj) {
                        var data = obj.data;

                        // 编辑操作
                        if (obj.event === 'edit') {
                            var index = layer.open({
                                title: '编辑快讯',
                                type: 2,
                                shade: 0.2,
                                maxmin: true,
                                shadeClose: true,
                                area: ['80%', '90%'],
                                content: './edit.html?type=edit&id=' + data.id,
                            });
                            return false;
                        }

                        // 隐藏/显示操作
                        else if (obj.event === 'hide' || obj.event === 'show') {
                            var isHide = obj.event === 'hide';
                            var confirmMsg = '确定' + (isHide ? '隐藏' : '显示') + '这条快讯吗？';
                            var successMsg = (isHide ? '隐藏' : '显示') + '成功';
                            var errorMsg = (isHide ? '隐藏' : '显示') + '失败，请重试';
                            var newDelFlag = isHide ? '1' : '0';

                            layer.confirm(confirmMsg, function (index) {
                                // 准备PUT请求数据，tags字段保持原样
                                var putData = {
                                    title: data.title,
                                    content: data.content,
                                    tags: data.tags,
                                    primary_category: data.primary_category,
                                    del_flag: newDelFlag
                                };

                                console.log('发送的请求数据:', putData);

                                // 调用PUT接口修改del_flag
                                $.ajax({
                                    url: _URL.news + '/' + data.id,
                                    type: 'PUT',
                                    headers: {
                                        'Authorization': 'Bearer ' + localStorage.getItem('t'),
                                        'Content-Type': 'application/json'
                                    },
                                    data: JSON.stringify(putData),
                                    success: function (res) {
                                        console.log('操作成功响应:', res);
                                        layer.msg(successMsg);
                                        layer.close(index);
                                        // 重新加载表格数据
                                        table.reload('currentTableId');
                                    },
                                    error: function (xhr, status, error) {
                                        console.error((isHide ? '隐藏' : '显示') + '操作失败:', error);
                                        console.error('请求数据:', putData);
                                        console.error('响应状态:', xhr.status);
                                        console.error('响应文本:', xhr.responseText);
                                        layer.msg(errorMsg);
                                    }
                                });
                            });
                        }

                        // 永久删除操作
                        else if (obj.event === 'delete') {
                            layer.confirm('确定永久删除这条快讯吗？此操作不可恢复！', function (index) {
                                $.ajax({
                                    url: _URL.news + '/' + data.id,
                                    type: 'DELETE',
                                    headers: {
                                        'Authorization': 'Bearer ' + localStorage.getItem('t'),
                                        'Content-Type': 'application/json'
                                    },
                                    success: function (res) {
                                        console.log('删除成功响应:', res);
                                        layer.msg("删除成功");
                                        layer.close(index);
                                        // 重新加载表格数据
                                        table.reload('currentTableId');
                                    },
                                    error: function (xhr, status, error) {
                                        console.error('删除操作失败:', error);
                                        console.error('响应状态:', xhr.status);
                                        console.error('响应文本:', xhr.responseText);
                                        layer.msg("删除失败，请重试");
                                    }
                                });
                            });
                        }
                    });
                });
            }
        })
    </script>
</body>

</html>
