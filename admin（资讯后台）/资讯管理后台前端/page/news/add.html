    <script>
        var App = new Vue({
            el: '#app',
            data: {
                
            },
            mounted: function () {
                
            },
            created: function () {
                let that = this;
                layui.use(['table','form', 'upload', 'tableSelect', 'laydate'], function () {
                    var form = layui.form,
                        layer = layui.layer,
                        table = layui.table,
                        tableSelect = layui.tableSelect,
                        laydate = layui.laydate,
                        $ = layui.$;
                    
                    form.on('submit(saveBtn)', function (data) {
                        console.log('提交的数据:', data.field);
                        
                        // 添加detail_content字段，内容与content相同
                        data.field.detail_content = data.field.content;
                        
                        postAction(data.field, _URL.news, function (ret) {                         
                                if (ret.success) {
                                    //在父页面上提示成功
                                    parent.layer.msg('添加成功');
                                    //刷新父页面数据
                                    parent.App.reloadData();
                                    //在父页面上关闭当前弹窗
                                    var index = parent.layer.getFrameIndex(window.name);
                                    parent.layer.close(index);
                                } else {
                                    // 显示错误信息
                                    layer.msg(ret.message || '添加失败');
                                }                           
                        });
                    });
                });
            },
            methods: {

            }
        });
