specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: Factory
    network: hashkeychain-sepolia
    source:
      address: "0x4Bba6F8eC4c5FC45338F25c75E3f018Aa3DCA48D"
      abi: Factory
      startBlock: 15684904
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: Factory/Factory.wasm
      entities:
        - Pool
        - Token
      abis:
        - name: Factory
          file: Factory/factory.json
        - name: ERC20
          file: Factory/ERC20.json
        - name: ERC20SymbolBytes
          file: Factory/ERC20SymbolBytes.json
        - name: ERC20NameBytes
          file: Factory/ERC20NameBytes.json
        - name: Pool
          file: Factory/pool.json
      eventHandlers:
        - event: PoolCreated(indexed address,indexed address,indexed uint24,int24,address)
          handler: handlePoolCreated
templates:
  - kind: ethereum/contract
    name: Pool
    network: hashkeychain-sepolia
    source:
      abi: Pool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: templates/Pool/Pool.wasm
      entities:
        - Pool
        - Token
      abis:
        - name: Pool
          file: Pool/pool.json
        - name: Factory
          file: Pool/factory.json
        - name: ERC20
          file: Pool/ERC20.json
      eventHandlers:
        - event: Initialize(uint160,int24)
          handler: handleInitialize
        - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
          handler: handleSwap
        - event: Mint(address,indexed address,indexed int24,indexed int24,uint128,uint256,uint256)
          handler: handleMint
        - event: Burn(indexed address,indexed int24,indexed int24,uint128,uint256,uint256)
          handler: handleBurn
        - event: Collect(indexed address,address,indexed int24,indexed int24,uint128,uint128)
          handler: handleCollect
