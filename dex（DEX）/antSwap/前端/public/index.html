<!DOCTYPE html>
<html translate="no">
  <head>
    <meta charset="utf-8" />
    <title>Antswap</title>
    <!--
      %PUBLIC_URL% will be replaced with the URL of the `public` folder during build.
      Only files inside the `public` folder can be referenced from the HTML.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#141723" />
    <meta
      http-equiv="Content-Security-Policy"
      <% if (process.env.REACT_APP_CSP_ALLOW_UNSAFE_EVAL) { %>
        content="script-src 'self' https://www.google-analytics.com https://www.googletagmanager.com 'unsafe-inline' 'unsafe-eval'"
      <% } else { %>
        content="script-src 'self' https://www.google-analytics.com https://www.googletagmanager.com 'unsafe-inline'"
      <% } %>
    />
    <!-- 
      Apple Smart App Banner for Safari on iOS
      https://developer.apple.com/documentation/webkit/promoting_apps_with_smart_app_banners
     -->
    <!--
      manifest.json provides metadata used when the app is installed as a PWA.
      See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="preconnect" href="https://www.google-analytics.com/" />

    <link rel="preload" href="%PUBLIC_URL%/fonts/Inter-roman.var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%PUBLIC_URL%/fonts/font.woff2" as="font" type="font/ttf" crossorigin />
     <link rel="preload" href="%PUBLIC_URL%/fonts/u2.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      * {
        font-family: 'Inter', sans-serif;
        box-sizing: border-box;
      }
      html,body{
        overflow-x: hidden;
      }
      /**
          Explicitly load Inter var from public/ so it does not block LCP's critical path.
        */
      @font-face {
        font-family: 'Inter custom';
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
        font-named-instance: 'Regular';
        src: url(%PUBLIC_URL%/fonts/Inter-roman.var.woff2) format('woff2 supports variations(gvar)'),
          url(%PUBLIC_URL%/fonts/Inter-roman.var.woff2) format('woff2-variations'),
          url(%PUBLIC_URL%/fonts/Inter-roman.var.woff2) format('woff2');
      }
     
      @font-face {
        font-family: 'U1';
        src: url(%PUBLIC_URL%/fonts/font.woff2) format('truetype');
         unicode-range: U+4E00-9FFF; /* 汉字区 */
      }
        @font-face {
        font-family: 'U1';
        src: url(%PUBLIC_URL%/fonts/u2.ttf) format('truetype');
         unicode-range: U+0020-007F; /* 基本拉丁字母和符号 */
      }
      @supports (font-variation-settings: normal) {
        * {
          font-family: 'Inter custom', sans-serif;
        }
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      button {
        user-select: none;
      }

      html {
        font-size: 16px;
        font-variant: none;
        font-smooth: always;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      }

      /* Use this to apply network-specific gradient backgrounds, in RadialGradientByChainUpdater.ts */
      #background-radial-gradient {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        pointer-events: none;
        width: 200vw;
        height: 200vh;
        transform: translate(-50vw, -100vh);
        z-index: -1;
      }
      html,
      body,
      #root {
        min-height: 100%;
      }
        html {
          background: linear-gradient(to bottom, #020712 0%, #021824 60%, #033040 100%);
        }
     .splash{
      position: fixed;
      width: 280px;
      top:42vh;
      left: 0;
      right: 0;
      margin: 0 auto;
       /* 呼吸效果 */
  animation: breathe 1.5s ease-in-out infinite;
  transform-origin: center center;
     }
     /* 定义呼吸动画 */
@keyframes breathe {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.1); /* 放大 10% */
  }
  100% {
    transform: scale(1);
  }
}
    </style>
  </head>
  <body>
    <img id="splash" class="splash" src="images/topLogo.png" alt="">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <!-- Triggers the font to load immediately and then is replaced by the app -->
      <div>&emsp;</div>
    </div>
    <div id="background-radial-gradient"></div>
    </body>
    <script>
   // 当 React 加载完毕，隐藏 Splash
    window.addEventListener('DOMContentLoaded', () => {
      const splash = document.getElementById('splash');
        splash.style.display = 'none';
    });
  </script>
</html>
