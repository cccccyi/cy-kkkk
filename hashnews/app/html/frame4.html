<!DOCTYPE HTML>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="maximum-scale=1.0, minimum-scale=1.0, user-scalable=0, initial-scale=1.0, width=device-width" />
    <meta name="format-detection" content="telephone=no, email=no, date=no, address=no">
    <title>Hello APP</title>
    <link rel="stylesheet" type="text/css" href="../css/apiutil.css" />
    <link rel="stylesheet" type="text/css" href="../css/border.css" />
    <link rel="stylesheet" type="text/css" href="../assets/iconfont/iconfont.css" />
    <link rel="stylesheet" href="../css/dark.css">
    <style>
        .mHeader {
            padding-left: 15px;
        }

        .flashTagsItem {
            -webkit-tap-highlight-color: transparent;
            outline: none;
            box-shadow: none;
            font-size: 16px;
            color: #999;
            height: 40px;
            line-height: 42px;
            display: inline-block;
            text-decoration: none;
            margin-left: 15px;
            cursor: pointer;
            position: relative;
            /* 使伪元素相对于当前元素定位 */
            transition: color 0.2s ease;
        }

        .flashTagsItem:first-child {
            margin-left: 0;
        }

        .flashTagsItemActive {
            color: rgba(0, 0, 0, 0);
            /* 透明文本 */
        }

        .flashTagsItem::after {
            content: attr(data-text);
            /* 使用 data-text 属性显示文本 */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-weight: bold;
            /* 加粗 */
            color: black;
            pointer-events: none;
            /* 防止伪元素影响点击事件 */
            opacity: 0;
            /* 默认透明 */
            transition: opacity 0.2s ease;
            white-space: nowrap;
            /* 防止换行 */
            /* 透明度过渡效果 */
        }

        .flashTagsItemActive::after {
            opacity: 1;
            /* 显示伪元素 */
        }

        .indicator {
            position: fixed;
            top: 40px;
            height: 3px;
            /* 指示条的高度 */
            background-color: #2e61e0;
            /* 指示条的颜色 */
            transition: transform 0.2s ease, width 0.2s ease;
            /* 动画效果 */
            border-radius: 10px;
        }

        .onip {
            float: right;
            margin-top: 11px;
            margin-right: 10px;
        }

        [v-cloak] {
            display: none;
        }
    </style>
</head>

<body id="app" v-cloak>
    <div class="mHeader">
        <span v-for="item,index in needData.slice(0,5)" class="flashTagsItem"
            :class="{'flashTagsItemActive': nowType == index}" @click="changeType(index)"
            :ref="el => { if (el) flashTagsItemRefs[index] = el }" :data-text="item.name">
            {{item.name}}
        </span>
    </div>
    <div class="indicator" ref="indicatorRef"></div>
</body>
<script type="text/javascript" src="../script/apiutil.js"></script>
<script src="../script/vue.global.prod.js"></script>
<script src="../api/url.js"></script>
<script src="../script/ajax.js"></script>
<script type="text/javascript">
    //默认主题切换
    let isDark = localStorage.getItem('isDark')
    if (isDark == "true") {
        document.documentElement.classList.add('dark');
    }


    apiready = function () {
        //监听主题变换
        api.addEventListener({
            name: 'changeTheme'
        }, function (ret, err) {
            if (ret.value.isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });
        // 创建 Vue 应用
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                let needData = ref([
                    {
                        name: '巨鲸动态',
                        link: 'whale'
                    },
                    {
                        name: '热门kol',
                        link: 'kol'
                    },
                    {
                        name: '来财',
                        link: 'goodluck'
                    }
                ]);
                let nowType = ref(0);
                let indicatorRef = ref(null); // 创建指示条的 ref
                let flashTagsItemRefs = ref([]); // 创建 Tab 项的 ref 数组
                onMounted(() => {
                    // 打开子窗口
                    var frames = needData.value.map((data, index) => {
                        return {
                            name: data.link, // 为每个 Frame 设置唯一的名称
                            url: data.link + '.html',  // Frame 页面的 URL
                            bounces: true
                        };
                    });
                    console.log(JSON.stringify(frames));
                    api.openFrameGroup({
                        name: 'huijv',
                        scrollEnabled: true,
                        rect: {
                            marginTop: api.pageParam.headerH + 43,
                            marginBottom: api.pageParam.footerH,
                            w: 'auto'
                        },
                        index: 0,
                        frames: frames,
                    }, function (ret, err) {
                        // 切换选项卡的回调
                        nowType.value = ret.index;
                        updateIndicator();
                    });
                    let topIndex = localStorage.getItem('topIndex')
                    if (topIndex == '4') {
                        localStorage.setItem('needShow', 'true');  //先控制二级窗口状态,汇聚页面默认不显示
                        // 控制 newsList 显示
                        api.setFrameGroupAttr({
                            name: 'huijv',
                            hidden: false,
                        });
                    }
                });
                const changeType = (index) => {
                    nowType.value = index;
                    updateIndicator();
                    api.setFrameGroupIndex({
                        scroll: true,
                        name: 'huijv',
                        index: index
                    });
                };
                const updateIndicator = () => {
                    // 获取选中项的 DOM 元素
                    const activeItem = flashTagsItemRefs.value[nowType.value];

                    if (activeItem) {
                        console.log(activeItem.offsetWidth)
                        console.log(activeItem.offsetLeft)
                        // 设置指示条的位置和宽度
                        indicatorRef.value.style.width = `${activeItem.offsetWidth}px`;
                        indicatorRef.value.style.transform = `translateX(${activeItem.offsetLeft - 0}px)`;
                    }
                };


                return {
                    needData,
                    nowType,
                    changeType,
                    indicatorRef, // 将指示条的 ref 传递到模板
                    flashTagsItemRefs // 将 Tab 项的 ref 数组传递到模板
                };
            }
        }).mount('#app');
    };
</script>

</html>
