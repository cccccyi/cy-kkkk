<script type="text/javascript" src="../script/apiutil.js"></script>
<script src="../script/vue.global.prod.js"></script>
<script src="../api/url.js"></script>
<script src="../script/ajax.js"></script>
<script type="text/javascript">
    //默认主题切换
    let isDark = localStorage.getItem('isDark')
    if (isDark == "true") {
        document.documentElement.classList.add('dark');
    }
    apiready = function () {
        //监听主题变换
        api.addEventListener({
            name: 'changeTheme'
        }, function (ret, err) {
            if (ret.value.isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });
        // 创建 Vue 应用
        const { createApp, ref, onMounted } = Vue;
        const app = createApp({
            setup() {
                const close = (index) => {
                    api.closeFrame();
                };
                //筛选条件
                let oi = ref(Number(api.pageParam.oi))
                let vol24 = ref(Number(api.pageParam.vol24))
                let aprPlus = ref(Number(api.pageParam.aprPlus))
                let aprUn = ref(Number(api.pageParam.aprUn))
                //交易所
                const checkListEx = ref(
                    api.pageParam.checkListEx
                )
                const closeSelf = () => {
                    api.closeFrame()
                }
                const sortJsonData = () => {
                    api.execScript({
                        frameName: 'funding',
                        script: 'getData("' + checkListEx.value + '","' + oi.value + '","' + vol24.value + '","' + aprPlus.value + '","' + aprUn.value + '")'
                    })
                }
                return {
                    close,
                    checkListEx,
                    oi,
                    vol24,
                    aprPlus,
                    aprUn,
                    closeSelf,
                    sortJsonData
                };
            }
        })
        app.mount('#app');
    }
</script>
