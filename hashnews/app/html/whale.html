<script type="text/javascript" src="../script/apiutil.js"></script>

<script type="text/javascript">

  //默认主题切换
  let isDark = localStorage.getItem('isDark')
  if (isDark == "true") {
    document.documentElement.classList.add('dark');
  }
  //打开链接
  // function openUrl(url){
  //   api.openApp({
  //     iosUrl : url, //打开微信的，其中weixin为微信的URL Scheme
  //   });
  // }
  function openUrl(url) {
    if (api.systemType === 'android') {
      // Android平台
      api.openApp({
          uri: url
      }, function (ret, err) {
          if (ret) {
              // api.alert({
              //     msg: JSON.stringify(ret)
              // });
          } else {
              var clipBoard = api.require('clipBoard');
              clipBoard.set({
                  value: url
              }, function (ret, err) {
                  if (ret) {
                      api.toast({
                          msg: "链接复制成功,请粘贴到浏览器中打开",
                          location: "middle",
                          global: true
                      });
                  } 
              });
          }
      });
    } else if (api.systemType === 'ios') {
      // iOS平台
      api.openApp({
        iosUrl: url
      }, function (ret, err) {
        if (err) {
          console.error('打开浏览器失败：', err);
        }
      });
    }
  }
  apiready = function () {

    //监听主题变换
    api.addEventListener({
      name: 'changeTheme'
    }, function (ret, err) {
      if (ret.value.isDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    });
    let needShow = localStorage.getItem('needShow');
    //默认隐藏，切换到本页时显示，防止预加载弹出覆盖其他页面,前提是点击的按钮3
    if (needShow == 'false') {
      api.setFrameGroupAttr({
        name: 'huijv',
        hidden: true
      });
    }
    // 创建 Vue 应用
    const { createApp, ref, onMounted } = Vue;
    const app = createApp({
      setup() {
        const pageNum = ref(1)
        const pageSize = ref(20)
        const list = ref([])   //快讯列表
        const loading = Vue.ref(false);
        onMounted(() => {
          //激活下拉刷新
          const frames = [];
          for (let i = 0; i <= 89; i++) {
            const paddedNumber = i.toString().padStart(3, '0');
            frames.push(`widget://frames/frame-${paddedNumber}.png`);
          }
          api.setCustomRefreshHeaderInfo({
            bgColor: 'rbga(0,0,0,0)',
            loadAnimInterval: '13',
            isScale: false,
            image: {
              //下拉过程中
              pull: frames,
              //加载过程中
              load: frames
            }
          }, function () {
            //获取数据
            pageNum.value = 1;
            getList('set', 'refresh')
          });
          //获取数据
          getList('set')
          //监听页面滚动到底部
          api.addEventListener({
            name: 'scrolltobottom',
            extra: {
              threshold: 0 // 设置距离底部多少距离时触发，默认值为0
            }
          }, function (ret, err) {
            if (!loading.value) {
              //锁定
              loading.value = true
              pageNum.value++
              setTimeout(() => {
                getList('add')
              }, 500)
            }
          });

        });
        //看详情
        const goDt = (item) => {
          api.openWin({
            name: 'whaleDt',
            url: 'whaleDt.html',
            pageParam: {
              item: item
            }
          })
        }
        const openImg = (index, imgUrl) => {
          api.openWin({
            name: 'image',
            url: 'image.html',
            animation: {
              type: "movein",                //动画类型（详见动画类型常量）
              subType: "from_bottom",       //动画子类型（详见动画子类型常量）
              duration: 300                //动画过渡时间，默认300毫秒
            },
            pageParam: {
              index: index,
              imgUrl: imgUrl
            }
          })
        }
        //获取快讯列表
        const getList = (type, isf) => {
          let requestData = {
            pageNum: pageNum.value,
            pageSize: pageSize.value,
            tag: 'whale'
          }
          getAction(requestData, _URL.tweetList, (responseData) => {
            if (responseData.code == '0') {
              //网不好
              api.toast({
                msg: '网络异常',
                location: "middle",
                global: true
              })
            }


            //   console.log(JSON.stringify(responseData));
            if (isf == 'refresh') {
              api.refreshHeaderLoadDone()
            }
            // responseData.data.list.forEach(item => {
            //   console.log(item.mediaUrlHttpsJson);
            //   item.mediaUrlHttpsJson = JSON.parse(item.mediaUrlHttpsJson);
            // });




            responseData.data.list.forEach(item => {
              if (item.mediaUrlHttpsJson) {
                try {
                  item.mediaUrlHttpsJson = JSON.parse(item.mediaUrlHttpsJson);
                } catch (e) {
                  console.warn('JSON 解析失败:', item.mediaUrlHttpsJson, e);
                  item.mediaUrlHttpsJson = [];
                }
              } else {
                item.mediaUrlHttpsJson = [];
              }
            });


            let response = responseData.data.list;
            //关锁
            loading.value = false
            type == 'set' ? list.value = response : list.value.push(...response);
          })
        }
        const copy = (val) => {
          let cs = val;
          var clipBoard = api.require('clipBoard');
          clipBoard.set({
            value: cs
          }, function (ret, err) {
            if (ret) {
              api.toast({
                msg: "复制成功",
                location: "middle",
                global: true
              });
            } else {
              api.toast({
                msg: "复制失败，请重试",
                location: "middle",
                global: true
              });
            }
          });

        }
        const splitString = (input) => {
          // 检查输入是否为字符串
          if (typeof input !== 'string') {
            return { error: '输入必须是字符串' };
          }

          // 查找分隔符的位置
          const separatorIndex = input.indexOf('<->');

          // 如果找不到分隔符，返回错误
          if (separatorIndex === -1) {
            return { error: '未找到分隔符 "<->"', fullText: input };
          }

          // 分割字符串为标题和内容
          let title = input.substring(0, separatorIndex).trim();
          let content = input.substring(separatorIndex + 3).trim();

          // 替换连续的换行符为单个换行符
          title = title.replace(/\n{2,}/g, '\n');
          content = content.replace(/\n{2,}/g, '\n');

          // 识别链接并添加点击事件，防止事件穿透
          const urlRegex = /(https?:\/\/[^\s<]+)/g;
          content = content.replace(urlRegex, (url) => {
            // 创建一个包含点击事件的链接元素，防止事件穿透
            return `<a href="#" onclick="event.stopPropagation(); openUrl('${url}'); return false;">${url}</a>`;
          });

          // 返回JSON对象
          return { title, content };
        };
        // 处理时间显示，列表中的
        const formatDate = (timestamp) => {
          if (!timestamp) return '-'; // 处理无效输入
          const now = new Date(); // 当前时间
          const time = new Date(timestamp * 1000); // 时间戳转换为毫秒

          // 获取东八区时间
          const options = {
            timeZone: 'Asia/Shanghai',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
          };

          // 判断是否是今天
          const isToday = now.toDateString() === time.toDateString();

          if (isToday) {
            return time.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Shanghai' });
          } else {
            return time.toLocaleString('zh-CN', options);
          }
        };
        return {
          copy,
          list,
          formatDate,
          goDt,
          openImg,
          splitString
        };
      }
    })
    app.use(ElementPlus);
    app.mount("#app");
  };
</script>
