<!DOCTYPE HTML>
<html style=" background: rgba(0,0,0,0) !important;">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="maximum-scale=1.0, minimum-scale=1.0, user-scalable=0, initial-scale=1.0, width=device-width" />
    <meta name="format-detection" content="telephone=no, email=no, date=no, address=no">
    <title>Hello APP</title>
    <link rel="stylesheet" type="text/css" href="../css/apiutil.css" />
    <link rel="stylesheet" type="text/css" href="../css/border.css" />
    <link rel="stylesheet" type="text/css" href="../assets/iconfont/iconfont.css" />
    <link rel="stylesheet" type="text/css" href="../assets/box.css" />
    <link href="../css/fonts6/css/fontawesome.css" rel="stylesheet" />
    <link href="../css/fonts6/css/solid.css" rel="stylesheet" />
    <link href="../css/fonts6/css/brands.css" rel="stylesheet" />
    <link href="../css/fonts6/css/regular.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/element-plus.css">
    <link rel="stylesheet" href="../css/dark.css">
    <style>
        .min-height-calc {
            min-height: calc(100vh - 135px);
        }

        .getMore {
            cursor: pointer;
            width: 98%;
            margin-top: 50px !important;
            height: 50px;
            margin: 0px auto;
            background: rgba(234, 238, 243, 0.5);
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #457ded;
            position: relative;
            z-index: 5;
            user-select: none;
        }

        .newsItem {
            height: 180px;
            position: relative;
            padding-top: 15px;
        }

        .newsItem .newsTitle {
            font-size: 16px;
            font-weight: 500;
            color: #333;
            line-height: 26px;
            display: inline;
            cursor: pointer;
        }


        .newsItem .newsMsg {
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            display: -webkit-box;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #898d94;
            font-size: 14px;
            line-height: 25px;
            margin-top: 0px;
        }

        .newsItem .btool {
            position: absolute;
            bottom: 20px;
            width: calc(100% - 230px);
        }



        .newsItem .btool .tags {
            color: rgb(163, 162, 162);
            margin-right: 20px;
            cursor: pointer;
            font-size: 11px;
            position: relative;
            top: -3px;
            user-select: none;
            padding: 2px 4px 2px 4px;

            border-radius: 2px;
        }
        .tblue{
            margin-left: 10px !important;
            color: #9fb9ee !important;
            border-color: #9fb9ee !important;
        }


        .flashBox {
            margin-top: 10px;
            border-bottom: solid 1px #e1e0e0;
            padding-bottom: 10px;
        }

        .flashItem .timeLine {
            width: 15px;
        }

        .flashItem .timeLine .bDot {
            width: 15px;
            height: 15px;
            background: #dde0ff;
            border-radius: 50%;
            position: relative;
            margin-top: 5px;
        }

        .flashItem .timeLine .bDot .sDot {
            width: 7px;
            height: 7px;
            background: #3881e1;
            position: absolute;
            top: 4px;
            left: 4px;
            border-radius: 50%;
        }

        .flashItem .timeLine .itemLine {
            border-left: 1px dashed #d9d9d9;
            width: 0px;
            margin-left: 7px;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        .flashItem .fmsg .times {
            font-size: 13px;
            color: #868686 !important;
            margin-left: 10px;
        }

        .flashItem .fmsg .ftitle {
            font-size: 15px;
            margin-left: 10px;
            font-weight: bold;
        }

        .flashItem .fmsg .fmcon {
            display: block;
            font-size: 13px;
            text-overflow: ellipsis;
            color: rgb(100, 100, 100);
            line-height: 25px;
            margin-top: 10px;
            margin-bottom: 30px;
            margin-left: 10px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
        }

        .title .moreFlash {
            font-size: 18px;
            color: #002fa7;
            float: right;
            cursor: pointer;
            margin-right: 10px;
        }

        .title .moreFlash .micon {
            font-size: 14px;
        }

        .hot {
            margin-top: -10px;
        }

        @media (max-width: 1100px) {
            .title {
                display: none;
            }

            #hot {
                display: none;
            }

            .flashBox {
                display: none;
            }

            .newsImg {
                width: 120px !important;
                height: 80px !important;
                margin-left: 10px !important;
                border-radius: 5px !important;
                background-size: cover;
                background-repeat: no-repeat;
                background-position: center;
                margin-top: 4px;
                float: left;
            }
            .newsTitle {
                -webkit-line-clamp: 3 !important;
                -webkit-box-orient: vertical !important;
                display: -webkit-box !important;
                overflow: hidden !important;
                text-overflow: ellipsis !important;
            }

            .btool {
                display: none;
            }

            .newsItem {
                display: block !important;
                overflow: hidden;
                height: auto !important;
            }

            .nmsg {
                width: calc(100% - 130px);
                float: left;
            }

            .btoolM {
                width: 100%;
                float: left;
                margin-top: 5px;
            }

            .btoolM .tags {
                color: rgb(163, 162, 162);
                cursor: pointer;
                font-size: 11px;
                user-select: none;
                padding: 2px 4px 1px 4px;
                border: solid 1px rgb(235, 232, 232);
                border-radius: 2px;
                line-height: 15px;
                margin-left: 10px;
                position: relative;
                top: -4px;
            }

            .btoolM .tags:first-child {
                margin-left: 0px !important;
            }

            .btoolM .sendTime {
                float: right;
                font-size: 13px;
                color: rgb(163, 162, 162);
                position: relative;
                margin-right: 1px;
                top: 2px;
            }

            .btoolM .writer {
                float: right;
                font-size: 14px;
                color: #868686;
            }
        }

        /* 适配电脑样式 */
        @media (min-width: 1100px) {
            .flashTagsMobile {
                display: none;
            }

            .btoolM {
                display: none;
            }
        }

        .refresher-image {
            width: 125px;
            animation: blinkAndScale 1.2s ease-in-out infinite;
            /* 添加闪烁和缩放动画 */
            margin-top: 35vh;
        }

        .loadingMore {
            font-size: 13px;
            color: #999;
            margin-top: 2px;
            margin-bottom: 20px;
        }

        /* 定义闪烁和缩放动画 */
        @keyframes blinkAndScale {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.05);
                opacity: 0.6;
            }
        }

        .mpd {
            padding-left: 15px;
            padding-right: 15px;
        }

        [v-cloak] {
            display: none;
        }
    </style>
</head>

<body id="app" style=" background: rgba(0,0,0,0) !important;min-height: 101vh;">
    <div class="mpd" v-cloak>
        <div v-if="list.length==0">
            <center>
                <img class="refresher-image ndL" src="../assets/ndlight.png" alt="">
                <img class="refresher-image ndD" src="../assets/nddark.png" alt="">
            </center>
        </div>
        <div v-for="item in list">
            <div class="newsItem setBox aui-border-b darkBorder" @click="goDt(item)">
                <div class="flex1  nmsg">
                    <p class="newsTitle">
                        {{item['title']}}
                    </p>
                    <!-- <p class="newsMsg">
                        {{item['description']}}
                    </p> -->
                </div>
                <!-- <div class="newsImg"
                    :style="{ backgroundImage: `url(${getFullImageUrl2(item.media_urls)})` }"
                    @click.stop="openImg(0,[getFullImageUrl(item.img)])">
                </div> -->
                <!-- <div v-if="item.imgLoaded" class="newsImg"
                    :style="{ backgroundImage: `url(${getFullImageUrl(item.img)})` }"
                    @click.stop="openImg(0,[getFullImageUrl(item.img)])">
                </div> -->
                <div v-if="item.imgLoaded" class="newsImg"
                    :style="{ backgroundImage: `url(${getFullImageUrl2(item.media_urls,item.title)})` }"
                    @click.stop="openImg(0,[getFullImageUrl2(item.media_urls,item.title)])">
                </div>
                <!-- {{item.img}} -->
                <el-skeleton v-if="!item.imgLoaded" class="newsImg" animated>
                    <template #template>
                        <el-skeleton-item variant="image" style="width: 100%;height: 100%;border-radius: 5px;" />
                    </template>
                </el-skeleton>
                <div class="btoolM" style="margin-bottom: 7px;">
                    <span style="position: relative;top:3px">
                        <span style="font-size: 13px; color: rgb(163, 162, 162);position: relative;top:-4px;left:-1px">哈世链闻</span>
                        <span class="tags">
                            原创
                        </span>
                        <span class="tags tblue" v-if="item.type=='B'">
                            长文分析
                        </span>
                    </span>
                
                  
                  
                    <span class="sendTime">
                        <i class="fa-regular fa-clock flIcon" style="margin-right: 1px !important;"></i>
                        {{toBeijingTime(item.created_at)}}
                    </span>
                </div>
            </div>
        </div>
        <center v-if="list.length>0&&!done">
            <img class="refresher-image ndL" src="../assets/ndlight.png" alt=""
                style="width: 100px !important;margin-top: 10px !important;">
            <img class="refresher-image ndD" src="../assets/nddark.png" alt=""
                style="width: 100px !important;margin-top: 10px !important;">
            <div class="loadingMore">
                加载中
            </div>
        </center>
    </div>
</body>
<script type="text/javascript" src="../script/apiutil.js"></script>
<script src="../script/vue.global.prod.js"></script>
<script src="../script/element-plus.js"></script>
<script src="../api/url.js"></script>
<script src="../script/ajax.js"></script>
<script type="text/javascript">
    //默认主题切换
    let isDark = localStorage.getItem('isDark')
    if (isDark == "true") {
        document.documentElement.classList.add('dark');
    }
    apiready = function () {
        //监听主题变换
        api.addEventListener({
            name: 'changeTheme'
        }, function (ret, err) {
            if (ret.value.isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });
        // alert(1)
        let needShowDeep = localStorage.getItem('needShowDeep');
        // 默认隐藏，切换到本页时显示，防止预加载弹出覆盖其他页面,前提是点击的按钮3
        if (needShowDeep == 'false') {
            api.setFrameAttr({
                name: 'deep',
                hidden: true
            });
        }
        // 创建 Vue 应用
        const { createApp, ref, onMounted, reactive } = Vue;
        const app = createApp({
            setup() {

                const pageNum = ref(1)
                const pageSize = ref(10)
                const list = ref([])   //列表

                const loading = Vue.ref(false);
                const done = Vue.ref(false);
                
                onMounted(() => {
                    //激活下拉刷新
                    const frames = [];
                    for (let i = 0; i <= 89; i++) {
                        const paddedNumber = i.toString().padStart(3, '0');
                        frames.push(`widget://frames/frame-${paddedNumber}.png`);
                    }
                    api.setCustomRefreshHeaderInfo({
                        bgColor: 'rbga(0,0,0,0)',
                        loadAnimInterval: '6',
                        isScale: false,
                        image: {
                            //下拉过程中
                            pull: frames,
                            //加载过程中
                            load: frames
                        }
                    }, function () {
                        //获取数据
                        pageNum.value = 1;
                        done.value = false;
                        getList('set', 'refresh')
                    });
                    //获取数据
                    getList('set')
                    //监听页面滚动到底部
                    api.addEventListener({
                        name: 'scrolltobottom',
                        extra: {
                            threshold: 0 // 设置距离底部多少距离时触发，默认值为0
                        }
                    }, function (ret, err) {
                        if (!loading.value) {
                            //锁定
                            loading.value = true
                            pageNum.value++
                            setTimeout(() => {
                                getList('add')
                            }, 100)
                        }
                    });

                });
                const goSearch = (val) => {
                    api.openWin({
                        name: 'search',
                        url: 'search.html',
                        pageParam: {
                            keyword: val
                        }
                    })
                }
                const goDt = (item) => {
                    api.openWin({
                        name: 'deepDt',
                        url: 'deepDt.html',
                        pageParam: {
                            item: item
                        }
                    })
                }
                //获取快讯列表
                const getList = (type, isf) => {
                    let requestData = {
                        page: pageNum.value,
                        pageSize: pageSize.value,
                        exclude:'哈世链闻app,交易所实时'
                    }
                    getAction(requestData, _URL.articleListNew, (responseData) => {
                      //  console.log(JSON.stringify(responseData));
                        // if (responseData.code == '0') {
                        //     //网不好
                        //     api.toast({
                        //         msg: '网络异常',
                        //         location: "middle",
                        //         global: true
                        //     })
                        // }
                        //  console.log(JSON.stringify(responseData));
                        
                        if (isf == 'refresh') {
                            api.refreshHeaderLoadDone()
                        }
                        let response = responseData.data;
                        if(response.length==0){
                            done.value = true
                        }
                        //初始化每一项的 imgLoaded 为 false，并监听图片加载
                        response.forEach((item, index) => {
                            const newItem = reactive({
                                ...item,
                                imgLoaded: false
                            });
                            const img = new Image();
                            // img.src = getFullImageUrl(item.img);
                            img.src = getFullImageUrl2(item.media_urls,item.title)
                            img.onload = () => {
                                newItem.imgLoaded = true;
                            };
                            img.onerror = () => {
                                newItem.imgLoaded = false;
                            };
                            response[index] = newItem;
                        });
                        // //关锁
                        loading.value = false
                        type == 'set' ? list.value = response : list.value.push(...response);

                    })
                }
                //处理图片URl
                const getFullImageUrl = (img) => {
                    return img.startsWith('http') ? img : 'https://hashnews.pro' + img;
                };
                const getFullImageUrl2 = (img,title) => {
                    if(img.length>0){
                        return img[0]
                    }else{
                        if(title.substring(0,4)=='巨鲸操作'){
                            return 'whale.png'
                        }else{
                            return 'noimage.png'
                        }
                        
                    }
                };
                //格式化tags
                const getProcessedTags = (tagsString) => {
                    return tagsString.split(/[ ,、]/).filter(tag => tag);
                };
                // 格式化时间
                // const formatTime = (isoTime) => {
                //     const date = new Date(isoTime);
                //     const year = date.getFullYear();
                //     const month = String(date.getMonth() + 1).padStart(2, '0');
                //     const day = String(date.getDate()).padStart(2, '0');
                //     const hour = String(date.getHours()).padStart(2, '0');
                //     const minute = String(date.getMinutes()).padStart(2, '0');
                //     return `${year}-${month}-${day} ${hour}:${minute}`;
                // };
                // 处理时间显示，列表中的
                const formatDate = (timestamp) => {

                    if (!timestamp) return { time: '-', date: '' }; // 处理无效输入

                    const now = new Date(); // 当前时间
                    const time = new Date(timestamp * 1000); // 时间戳转换为毫秒

                    // 辅助函数：确保数字为两位数
                    function padZero(num) {
                        return num < 10 ? '0' + num : num;
                    }

                    // 获取时间部分（24小时制）
                    const hours = padZero(time.getHours());
                    const minutes = padZero(time.getMinutes());
                    const formattedTime = `${hours}:${minutes}`;

                    // 判断是否是今天
                    const isToday = now.toDateString() === time.toDateString();

                    if (isToday) {
                        // 今天只显示时间（时:分）
                        return {
                            time: formattedTime,
                            date: ''
                        };
                    } else {
                        // 非今天显示日期（月-日）和时间（时:分）
                        const month = padZero(time.getMonth() + 1);
                        const day = padZero(time.getDate());
                        const formattedDate = `${month}/${day}`;

                        return {
                            time: formattedTime,
                            date: formattedDate
                        };
                    }
                }
                const toBeijingTime =(utcString) => {
                    const date = new Date(utcString);

                    // 北京时间 = UTC + 8 小时
                    const beijing = new Date(date.getTime() + 8 * 60 * 60 * 1000);

                    const MM = String(beijing.getMonth() + 1).padStart(2, '0');
                    const DD = String(beijing.getDate()).padStart(2, '0');
                    const HH = String(beijing.getHours()).padStart(2, '0');
                    const mm = String(beijing.getMinutes()).padStart(2, '0');

                    return `${MM}-${DD} ${HH}:${mm}`;
                }
                const openImg = (index, imgUrl) => {
                    api.openWin({
                        name: 'image',
                        url: 'image.html',
                        animation: {
                            type: "movein",                //动画类型（详见动画类型常量）
                            subType: "from_bottom",       //动画子类型（详见动画子类型常量）
                            duration: 300                //动画过渡时间，默认300毫秒
                        },
                        pageParam: {
                            index: index,
                            imgUrl: imgUrl
                        }
                    })
                }
                return {
                    list,
                    formatDate,
                    getProcessedTags,
                    goDt,
                    getFullImageUrl,
                    getFullImageUrl2,
                    goSearch,
                    openImg,
                    done,
                    toBeijingTime
                };
            }
        })
        app.use(ElementPlus);
        app.mount("#app");
    };
</script>

</html>
