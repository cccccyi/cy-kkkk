<script type="text/javascript">


 //默认主题切换
 let isDark =  localStorage.getItem('isDark')
  if(isDark=="true"){
    document.documentElement.classList.add('dark');
  }
    apiready = function () {
         //监听主题变换
    api.addEventListener({
        name: 'changeTheme'
    }, function(ret, err) {
      if(ret.value.isDark){
        document.documentElement.classList.add('dark');
      }else{
        document.documentElement.classList.remove('dark');
      }
    });
        api.openFrame({
            name: 'funding',
            url: 'funding.html',
            rect: {
                marginTop: api.pageParam.headerH + 25,
                marginBottom: api.pageParam.footerH,
                w: 'auto'
            },
            pageParam:{
                headerH:api.pageParam.headerH,
                footerH:api.pageParam.footerH
            }
        })    
        let topIndex = localStorage.getItem('topIndex')
        if(topIndex=='3'){
            localStorage.setItem('needShowFunding','true');  //先控制二级窗口状态,资金费默认不显示
            api.setFrameAttr({
                name: 'funding',
                hidden:false
            });
        }
    };
</script>
