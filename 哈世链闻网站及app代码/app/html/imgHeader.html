<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="maximum-scale=1.0,minimum-scale=1.0,user-scalable=0,initial-scale=1.0,width=device-width" />
    <meta name="format-detection" content="telephone=no,email=no,date=no,address=no">
    <title>Hello APP</title>
    <link rel="stylesheet" type="text/css" href="../css/apiutil.css" />
    <style type="text/css">
        html,
        body {
            height: 100%;
            background-color: rgba(0, 0, 0, 0);
            overflow: hidden;
            text-shadow: 1px 1px 5px rgb(50, 50, 50);
        }

        .imgsb {
            border: solid 3px rgba(255, 255, 255, 0.7);
            border-radius: 5px;
            height: 130px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="wrap" id="app">
        <div style="margin-top: 80px;">
            <center>
                <font style="color: white;font-size: 25px;">{{now}} / {{all}}</font>
            </center>
            <font onclick="api.closeWin()" style="position: absolute;top:82px;z-index: 9999;right:20px;color: white;">
                <svg t="1725956191810" class="icon" viewBox="0 0 1024 1024" version="1.1"
                    xmlns="http://www.w3.org/2000/svg" p-id="4260" width="25" height="25">
                    <path
                        d="M813.653333 802.986667a42.666667 42.666667 0 0 1-60.373333 0L512 561.706667 270.72 802.986667a42.666667 42.666667 0 1 1-60.373333-60.373334L451.626667 501.333333 210.346667 260.053333a42.666667 42.666667 0 0 1 30.293333-72.746666 42.666667 42.666667 0 0 1 30.08 12.373333L512 440.96 753.28 199.68a42.666667 42.666667 0 0 1 72.746667 30.293333 42.666667 42.666667 0 0 1-12.373334 30.08L572.373333 501.333333l241.28 241.28a42.666667 42.666667 0 0 1 0 60.373334z"
                        p-id="4261" fill="#ffffff"></path>
                </svg>
            </font>
        </div>
    </div>
</body>
<script type="text/javascript" src="../script/apiutil.js"></script>
<script src="../script/vue.global.prod.js"></script>
<script type="text/javascript">
    apiready = function () {
        // 创建 Vue 应用
        const { createApp, ref, onMounted } = Vue;
        const app = createApp({
            setup() {
                let now = ref(api.pageParam.index + 1);
                let all = api.pageParam.allNum;
                onMounted(() => {
                    api.addEventListener({
                        name: 'imgCheck'
                    }, function(ret, err) {
                        now.value = ret.value.index + 1;
                    });
                });
                return {
                    now,
                    all
                };
            }
        })
        app.mount("#app");
    };
</script>

</html>
