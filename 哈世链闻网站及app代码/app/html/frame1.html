<script type="text/javascript">
 //默认主题切换
 let isDark =  localStorage.getItem('isDark')
  if(isDark=="true"){
    document.documentElement.classList.add('dark');
  }
    apiready = function () {
          //监听主题变换
    api.addEventListener({
        name: 'changeTheme'
    }, function(ret, err) {
      if(ret.value.isDark){
        document.documentElement.classList.add('dark');
      }else{
        document.documentElement.classList.remove('dark');
      }
    });
        api.openFrame({
            name: 'deep',
            url: 'deep.html',
            rect: {
                marginTop: api.pageParam.headerH + 10,
                marginBottom: api.pageParam.footerH + 10,
                marginLeft: 10,
                marginRight: 10
                // w: 'auto'
            },
            pageParam: {
                headerH: api.pageParam.headerH,
                footerH: api.pageParam.footerH
            }
        })
        let topIndex = localStorage.getItem('topIndex')
        if(topIndex=='1'){
        localStorage.setItem('needShowDeep','true');  //先控制二级窗口状态,深度默认不显示
            api.setFrameAttr({
                name: 'deep',
                hidden:false
            });
        }
    };
