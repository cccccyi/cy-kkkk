query Swaps($first: Int!, $skip: Int!, $where: Swap_filter) {
  swaps(first: $first, skip: $skip, where: $where, orderBy: timestamp, orderDirection: desc) {
    id
    transaction {
      id
    }
    sender
    recipient
    timestamp
    pool {
      id
    }
    token0 {
      id
      symbol
      decimals
    }
    token1 {
      id
      symbol
      decimals
    }
    amount0
    amount1
    amountUSD
    sqrtPriceX96
    tick
    logIndex
  }
}