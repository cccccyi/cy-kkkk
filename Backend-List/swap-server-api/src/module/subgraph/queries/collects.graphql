query Collects($first: Int!, $skip: Int!, $where: Collect_filter) {
  collects(first: $first, skip: $skip, where: $where, orderBy: timestamp, orderDirection: desc) {
    id
    transaction {
      id
      blockNumber
    }
    timestamp
    pool {
      id
      token0 {
        id
        symbol
        decimals
      }
      token1 {
        id
        symbol
        decimals
      }
    }
    owner
    origin
    tickLower
    tickUpper
    amount0
    amount1
    amountUSD
  }
}