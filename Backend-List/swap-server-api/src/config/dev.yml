# 权限 白名单配置
perm:
  router:
    whitelist:
      [
        { path: '/nonce/:address', method: 'GET' },
        { path: '/verify', method: 'POST' },
        { path: '/tracker/tokens/:tokenIdOrTokenAddr', method: 'GET' },
        { path: '/tracker/tokens/:tokenIdOrTokenAddr/addresses/:ownerAddrOrPkh/utxos', method: 'GET' },
        { path: '/tracker/tokens/:tokenIdOrTokenAddr/addresses/:ownerAddrOrPkh/balance', method: 'GET' },
        { path: '/tracker/tokens/:tokenIdOrTokenAddr/mintAmount', method: 'GET' },
        { path: '/tracker/tokens/:tokenIdOrTokenAddr/circulation', method: 'GET' },
        { path: '/tracker/tokens/:tokenIdOrTokenAddr/holders', method: 'GET' },
        { path: '/token/tokenList', method: 'GET' },
        { path: '/pool/poolList', method: 'GET' },
        { path: '/pool/findPoolOne/:id', method: 'GET' },
        { path: '/captchaImage', method: 'GET' },
        { path: '/register', method: 'POST' },
        { path: '/login', method: 'POST' },
        { path: '/logout', method: 'POST' },
        { path: '/perm/{id}', method: 'GET' },
        { path: '/upload', method: 'POST' },
